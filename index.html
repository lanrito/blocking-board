<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Director’s Notebook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/dn-touch.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/dn-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/dn-192.png">
<meta name="theme-color" content="#1e1f22">
<meta name="apple-mobile-web-app-title" content="Director’s Notebook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* VOICE: a working tool for set and scout days; the diagram is paper, the chrome stays out of the way
   IDEA: Shot Designer's overhead plan: dark tool strip below, shot list down the right
   PICTURE: the floor-plan canvas, edge to edge
   COLOR/TYPE: graphite toolbars and menus, paper-white canvas; setup and character colors are the only color; system sans
   LAYOUT: slim top bar, canvas, dark bottom toolbar; shot list column right (drawer under 1000px) */
:root{color-scheme:light dark;
 --bg:light-dark(#e9e7e2,#141518);--panel:light-dark(#ffffff,#1d1e22);--ink:light-dark(#1c1c1e,#ececec);
 --mut:light-dark(#6b6b70,#9b9ba3);--line:light-dark(#dad8d2,#313238);--chip:light-dark(#f1f0ec,#2a2b31);
 --accent:#2f6fde;--danger:#c93a36;--dark:#1e1f22;--dark2:#2c2d31;--paper:#ffffff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
 font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-rows:50px minmax(0,1fr);grid-template-columns:minmax(0,1fr) 300px;height:100vh;height:100dvh}
#app.side-off{grid-template-columns:minmax(0,1fr) 0}#app.side-off #side{display:none}
#top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;padding:0 4px;white-space:nowrap;display:flex;align-items:center;gap:8px}.brand img{border-radius:6px;display:block}
#top select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:0 8px;max-width:240px;font-size:16px}
#sceneBtn{height:36px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:0 10px;max-width:min(400px,42vw);min-width:0;font-size:15px}
#sceneBtn svg{flex:none}#sceneBtnT{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:600}#sceneBtnT small{font-size:13px;font-weight:500;color:var(--mut)}
.card.brcard{width:min(600px,100%);height:min(86vh,760px);padding:0;display:flex;flex-direction:column;overflow:hidden}
#br{display:flex;flex-direction:column;height:100%;min-height:0}
.brh{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:10px 10px 2px}
.brh h3{margin:0;text-align:center;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brb{width:40px;height:40px;border:0;border-radius:20px;background:none;font-size:24px;line-height:1;color:var(--mut)}.brb:hover{background:var(--chip)}
.brcr{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;justify-content:center;padding:0 16px 2px;font-size:13px;color:var(--mut)}
.brcr button{border:0;background:none;color:var(--accent);padding:3px 4px;font-size:13px}
.brsearch{margin:8px 14px 6px;position:relative}.brsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px}
.brsearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--chip);padding:0 12px 0 36px;font-size:16px;box-sizing:border-box}
#brTools{display:flex;gap:8px;padding:2px 14px 10px;flex-wrap:wrap}#brTools:empty{display:none}
#brTools button{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--panel);font-size:14px}
#brTools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#brTools .danger,.menu button.danger,#brFoot .danger{color:#c0392b}
#brL{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.brsec{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:14px 16px 6px}
.bilogo{width:24px;height:24px;border-radius:5px;display:block}
.brr{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;min-height:58px;border-bottom:1px solid var(--line);cursor:pointer}
.brr:hover{background:var(--chip)}.brr.cur{background:rgba(58,123,213,.07)}.brr.picked{background:rgba(58,123,213,.14)}
.bri{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center}.bri svg{width:30px;height:30px}
.brt{flex:1;min-width:0}.brt b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brt b em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);margin-left:8px;text-transform:uppercase;letter-spacing:.04em}
.brt small{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brm{width:42px;height:42px;border:0;background:none;border-radius:21px;color:var(--mut);font-size:12px;letter-spacing:1px;flex:none}.brm:hover{background:rgba(0,0,0,.07)}
.chev{color:var(--mut);font-size:22px;width:16px;flex:none}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid #b8bcc4;box-sizing:border-box}.picked .ck{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px #fff}
.brempty{padding:44px 24px;text-align:center;color:var(--mut)}.brempty small{display:block;margin-top:8px;font-size:12.5px}
.brnote{font-size:13px;color:var(--mut);padding:10px 16px;border-bottom:1px solid var(--line)}
#brFoot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}#brFoot:empty{display:none}
#brFoot span{flex:1;font-weight:650}#brFoot button{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--chip)}#brFoot button:disabled{opacity:.45}
#brSub{display:none}#br.sub>*:not(#brSub){display:none}#br.sub #brSub{display:block;padding:20px;overflow:auto;flex:1}
.mvl{margin-top:10px;border-top:1px solid var(--line)}.mvl button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px;padding-right:12px}
.mvl button svg{width:22px;height:22px;flex:none}.mvl button:disabled{opacity:.4;cursor:default}.mvl small{color:var(--mut)}
details.oth{margin-top:12px}details.oth summary{font-size:12.5px;font-weight:650;color:var(--mut);cursor:pointer;margin-bottom:8px}
.kb{float:right;color:var(--mut);font-size:12px;margin-top:2px}
.card.imcard{width:min(660px,100%)}
.imgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.imgrid select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--chip);padding:0 8px;font-size:16px}
.imsc{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:9px;font-size:13px}.imsc div{padding:6px 10px;border-bottom:1px solid var(--line)}.imsc b{display:inline-block;min-width:34px;color:var(--mut)}.imsc small{display:block;color:var(--mut);padding-left:34px}
.imch{max-height:min(42vh,380px);overflow:auto;border:1px solid var(--line);border-radius:10px}
.imr{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}.imr.off .imn,.imr.off .imsx{opacity:.4}
.imck{width:24px;height:24px;border-radius:6px;border:1.5px solid #b8bcc4;background:var(--panel);font-size:14px;line-height:1;padding:0;flex:none;color:#fff}.imr:not(.off) .imck{background:var(--accent);border-color:var(--accent)}
.imn{flex:1;min-width:0}.imn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.imn small{color:var(--mut);font-size:12px}
.imsx{flex:none}.imsx button{min-height:32px;padding:0 10px;font-size:13px}.imq{width:38px;font-style:normal;font-size:11px;color:#b7791f;font-weight:700;flex:none}
.imopt{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.card.keycard{width:min(560px,100%)}.kt div{display:flex;gap:12px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.kt kbd{flex:none;min-width:92px;font:600 12.5px/1.6 ui-monospace,Menlo,monospace;color:var(--ink)}
.grip{cursor:grab;touch-action:none;color:#a3a5ab;font-size:16px;line-height:1;padding:6px 4px;flex:none;user-select:none;-webkit-user-select:none}
#shots .sr{grid-template-columns:54px minmax(0,1fr) 30px}.sr .grip{order:9;justify-self:center}.sl .grip{margin-left:6px;vertical-align:middle}
.dragging{opacity:.45}.dropline{position:fixed;height:3px;background:var(--accent);border-radius:2px;z-index:80;pointer-events:none}
#drop{position:fixed;z-index:70;background:#232427;color:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);min-width:240px;overflow:hidden}
#drop h4{margin:0;padding:12px 16px;text-align:center;font-size:16px;border-bottom:1px solid #3a3b40}
#drop button{display:block;width:100%;min-height:48px;padding:0 18px;border:0;border-bottom:1px solid #34353a;background:none;color:#fff;font-size:15.5px;text-align:left}#drop button:hover{background:#2e2f34}
.card.numcard{width:min(520px,100%)}.rgrp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rrow{display:flex;align-items:center;width:100%;min-height:46px;padding:6px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}.rrow:last-child{border-bottom:0}
.rrow span{flex:1}.rrow b{font-weight:600}.rrow small{display:block;color:var(--mut);font-size:12px}
.rrow .rad{width:20px;height:20px;border-radius:50%;border:2px solid #9a9ba1;flex:none;box-sizing:border-box}.rrow .rad.on{border:6px solid var(--accent)}
.bgrip{font-size:17px;padding:8px 6px}.brr.droptgt,.brcr button.droptgt,.brb.droptgt{background:rgba(47,111,222,.16);outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.menu .mgh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8b90;padding:12px 4px 4px}#brSub .menu,.menu.tplm{max-height:62vh;overflow:auto}
.brghost{position:fixed;z-index:90;pointer-events:none;background:#232427;color:#fff;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#animBar{display:flex;align-items:center;gap:2px;min-width:0}#animBar>button{min-width:40px}#animBar #aPlay.on{background:#2f6fde;color:#fff}
#animBar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.asteps{display:flex;gap:1px;align-items:center;overflow-x:auto;max-width:min(46vw,620px);scrollbar-width:none}.asteps::-webkit-scrollbar{display:none}
.aslab{flex:none;align-self:center;font-size:11.5px;font-weight:650;color:#f5c26b;padding:0 4px 0 8px;white-space:nowrap;border-left:2px solid #f5c26b;margin-left:4px}#animBar #aVis.on{background:#3a3b40;color:#fff}
#pop .spdrow{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 18px;border-bottom:1px solid #34353a;color:#fff;font-size:16px}#pop .spdb{display:flex;align-items:flex-end;gap:4px;height:26px}#pop .spdb i{width:9px;border-radius:2px;background:#5d5e64;cursor:pointer}#pop .spdb i.on{background:#3ecf6a}#pop .spdb.off i.on{background:#2b8a49}
#bar .ast{flex:none;min-width:34px;font-weight:700;color:#d6d7dc;padding:0 6px}#bar .ast.dim{color:#6c6d73}#bar .ast.cur{color:#fff;background:#2f6fde;border-radius:8px}
.stepgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px 14px;width:290px;box-sizing:border-box}.stepgrid button{height:40px;border-radius:8px;border:1px solid #3a3b40;background:#2c2d31;color:#fff;font-weight:700;font-size:15px}.stepgrid button.on{background:#2f7cf6;border-color:#2f7cf6}
#pop .pgonly{margin-left:8px;font-size:11px;font-weight:700;color:#8fb6ff;text-transform:uppercase}
.imxr .xl{width:110px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--chip);font-size:14px;text-transform:uppercase}.imxr .xn{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--chip);font-size:15px}.imxr{cursor:default}
#pop .lays .lrow{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px 0 18px;border-bottom:1px solid #34353a}
#pop .lays .lrow.dis{opacity:.45}#pop .lays .ln{width:118px;flex:none;font-size:15px}#pop .lays input[type=range]{flex:1;min-width:0;accent-color:#3d8bf7}
#pop .lays .lv{width:28px;text-align:right;font-size:13px;color:#c9cad0;font-variant-numeric:tabular-nums}
#pop .lays .lk{width:36px;height:36px;border-radius:8px;border:0;background:none;color:#7c7d84;display:flex;align-items:center;justify-content:center;flex:none;padding:0;min-height:0}
#pop .lays .lk.on{color:#fff;background:#2f7cf6}#pop .lays .lall{justify-content:space-between}
#pop .lays .lkall{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #45464c;background:#2c2d31;color:#fff;font-size:14px;width:auto;min-height:0}#pop .lays .lkall.on{background:#2f7cf6;border-color:#2f7cf6}
#pop .hdr{float:right;font-weight:400;opacity:.7}
#pop .dmr{display:flex;border-bottom:1px solid #34353a}#pop .ls .dmr button{flex:1;justify-content:center;min-height:50px;font-size:20px;font-weight:600;border-bottom:0;border-right:1px solid #34353a;padding:0}#pop .ls .dmr button:last-child{border-right:0}#pop .ls .dmr button.on{background:#3f6fd8}#pop .ls .dmr button:disabled{opacity:.35}
#pop .cgrid{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:4px;padding:11px 14px 13px;border-bottom:1px solid #34353a}
#pop .ls .cgrid button.sw,#pop .ls .cgrid button.sw:hover{flex:0 0 22px;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:var(--c);transition:transform .1s}
#pop .ls .cgrid button.sw:hover{transform:scale(1.15)}#pop .ls .cgrid button.sw.on{border-color:#fff;box-shadow:0 0 0 2px #2f7cf6}
#pop .cgrid .cust{position:relative;flex:0 0 22px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2px dashed #8a8b91;display:flex;align-items:center;justify-content:center;color:#d6d7dc;font-size:15px;line-height:1;overflow:hidden;cursor:pointer}#pop .cgrid .cust input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;font-size:14px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.sp{flex:1}
#status{font-size:12.5px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer;min-height:36px}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut)}
#status.ok::before{background:#30a46c}#status.warn::before{background:#e3a008}#status.bad::before{background:var(--danger)}#status.bad{color:var(--danger)}
#main{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;background:var(--paper);color:#1c1c1e;color-scheme:light}
#wrap{position:relative;flex:1;min-height:0;background:#fbfbf9;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#items .L-free>rect:first-child{stroke:#2f5f8f;stroke-opacity:.4;stroke-width:.8px;stroke-dasharray:3 2.5}
#chip{position:absolute;left:12px;top:10px;max-width:calc(100% - 24px);text-align:left;border:1px solid #e1e0db;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 12px;color:#1c1c1e;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#chip b{font-size:15px;text-transform:uppercase}#chip span{display:block;font-size:12px;color:#6b6b70;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#6f6f74;max-width:380px;pointer-events:none}
#empty b{display:block;font-size:19px;color:#2a2a2d;margin-bottom:6px}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--dark);color:#fff;padding:6px 6px 6px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6;max-width:calc(100% - 24px)}
#banner.on{display:flex}#banner .pent{font-weight:700;margin-right:4px}#banner .penc{width:26px;height:26px;min-width:0;padding:0;border-radius:50%;background:var(--c);border:2px solid #55565c}#banner .penc.on{box-shadow:0 0 0 2px #fff}#banner .penw{width:32px;min-width:0;padding:0;height:30px;background:#3a3b40;display:flex;align-items:center;justify-content:center}#banner .penw i{display:block;border-radius:50%;background:#fff}#banner .penw.on{background:#2f6fde}#banner .pensep{width:1px;height:22px;background:#55565c}#bannerTxt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}#banner button{height:36px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:650}
#ctx{position:absolute;display:none;gap:2px;background:var(--dark);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:5;white-space:nowrap}
#ctx.on{display:flex}
#ctx button{height:40px;padding:0 12px;border:0;border-radius:8px;background:none;color:#fff;font-size:14px}
#ctx button:hover,#ctx button:active{background:var(--dark2)}
#ctx .nm{display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;color:#fff;font-weight:700;font-size:14px;border-right:1px solid #3a3b40;margin-right:2px}
#ctx .nm i{width:12px;height:12px;border-radius:50%}
#ctx .dg{color:#ff8a85}
#insp{position:absolute;right:12px;top:12px;width:320px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);color-scheme:light dark;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.2);padding:14px 16px 16px;display:none;z-index:7;-webkit-overflow-scrolling:touch}
#insp.on{display:block}
#bar{display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--dark);color:#fff;overflow-x:auto;flex:none}
#bar button{height:44px;min-width:44px;padding:0 10px;border:0;border-radius:9px;background:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;white-space:nowrap}
#bar button:hover,#bar button.open{background:var(--dark2)}
#bar button.on{background:#3d4a63}
#bar button:disabled{opacity:.35}
#bar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar .pq{min-width:38px;font-weight:700;color:#bfc0c6}#bar .pq.cur{color:#fff;background:var(--dark2)}
#bar .sep{width:1px;height:26px;background:#3a3b40;margin:0 6px;flex:none}
#pop{position:absolute;bottom:62px;left:8px;z-index:9;background:#232427;color:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:none;max-height:calc(100% - 80px);overflow:auto;-webkit-overflow-scrolling:touch}
#pop.on{display:block}
#pop h4{margin:0;padding:12px 16px;text-align:center;font-size:17px;border-bottom:1px solid #3a3b40;position:sticky;top:0;background:#232427;z-index:1}

function migrateScene(s){
 if(!s.wv){for(const it of (s.items||[]))if(it.type==='wall'&&(it.t==null||it.t===8))it.t=WALL_T;s.wv=1;}
 if(!s.items){s.items=[];s.pages.forEach((pg,pi)=>{for(const it of (pg.items||[])){
   if(it.type==='rect'){it.type='prop';it.kind='sqtable';delete it.fill;}
   if(it.type==='round'){it.type='prop';it.kind='roundtable';it.w=it.h=it.r*2;it.rot=0;delete it.r;delete it.fill;}
   if(it.type==='mask')it.kind='mask';
   it.pg=(!ACTOR(it.type)&&pi===0)?null:pg.id;s.items.push(it);}
  if(pg.bgId&&!s.bgId){s.bgId=pg.bgId;s.bg=pg.bg;}delete pg.items;delete pg.bgId;delete pg.bg;});}
 for(const it of s.items)if('pg' in it){it.pgs=it.pg?[it.pg]:null;delete it.pg;}
 if(!s.pageId||(s.pageId!=='all'&&!s.pages.some(p=>p.id===s.pageId)))s.pageId=s.pages[0].id;
 for(const it of s.items){const ps=it.marks||it.mv?positions(it):[];for(let i=1;i<ps.length;i++){const b=ps[i];if(b.c){const a=ps[i-1];b.cp=[toTD(a,b,{x:(a.x+b.x)/2+b.c.x/2,y:(a.y+b.y)/2+b.c.y/2})];delete b.c;}}}
 if(!s.numbering&&s.setups.length){s.setups.sort((a,b)=>natCmp(a.num,b.num));const used=new Set(s.items.filter(i=>i.type==='cam').map(i=>i.setupId)),live=s.setups.filter(st=>used.has(st.id));s.numbering={auto:live.every((st,i)=>+st.num===i+1)};}
 for(const it of s.items)if(it.type==='char'&&it.marks.some(m=>m.turn!=null)){const out=[];it.marks.forEach(m=>{out.push(m);if(m.turn!=null){const t=m.turn;delete m.turn;shiftAxis(s,it.id,out.length,1);out.push({x:m.x,y:m.y,rot:t,t:1});}});it.marks=out;}
 for(const it of s.items)if(it.kind==='dollytrack'){it.h=TRACK_H;it.w=Math.max(4,Math.round(it.w/FT/4)*4)*FT;}
 for(const it of s.items)if(it.type==='cam')for(const m of it.marks)if(m.sbp){m.sba={x:m.x+m.sbp.x,y:m.y+m.sbp.y};delete m.sbp;}
 for(const it of s.items)if(it.type==='cam'&&it.desc!=null){if(!it.marks[0].type)it.marks[0].type=it.desc;delete it.desc;}
}

 if(!P||!Array.isArray(P.scenes)||!P.scenes.length){const s=blankScene(1);P={characters:[],folders:[],scenes:[s],sceneId:s.id,ui:{}};sync={stamps:{},dirty:[]};}
 delete sync.base;P.ui=P.ui||{};P.characters=P.characters||[];P.folders=P.folders||[];P.labels=P.labels||{};P.text=P.text||{};for(const id in P.text)if(!P.scenes.some(s=>s.id===id))delete P.text[id];

function baseline(){lastJson={};const d=docs();for(const k in d)lastJson[k]=JSON.stringify(d[k]);}

 for(const k in d){const j=JSON.stringify(d[k]);if(j!==lastJson[k]){lastJson[k]=j;sync.stamps[k]=now;markDirty(k);}}
 for(const k of Object.keys(lastJson))if(!(k in d)){delete lastJson[k];sync.stamps[k]=now;markDirty(k);}}

function rowsOf(s,pid){const out=[],cams=s.items.filter(it=>it.type==='cam'&&(!pid||vis(it,s,pid)));for(const st of s.setups){const list=cams.filter(c=>c.setupId===st.id).sort(byLetter);list.forEach((it,ci)=>{let vn=0;it.marks.forEach((m,vi)=>{if(m.tk)return;out.push({st,it,m,vi,vn:vn++,first:ci===0&&vi===0});});});}return out;}
function renderShots(){
 const s=scene(),rows=rowsOf(s);let h='';let prev=null;
 for(const r of rows){if(prev&&prev!==r.st)h+='<div class="sgap"></div>';prev=r.st;
  const on=sel&&sel.id===r.it.id&&(sel.mark||0)===r.vi,desc=(r.m.desc||'').split('\n')[0];
  h+=`<div class="sr${on?' on':''}" data-act="selCam" data-id="${r.it.id}" data-v="${r.vi}"><span class="grip" title="Drag to reorder">⠿</span><div class="sn" style="color:${shade(r.st.color,-.25)}">${esc(shotCode(s,r.it))}${nVer(r.it)>1?`<small>V${verCode(s,r.vn)}</small>`:''}</div><div class="st">${esc(vlabel(r.m)||'No size or type yet')}${desc?`<small>${esc(desc)}</small>`:s.pages.length>1&&r.it.pgs?`<small>Page ${esc(pagesSummary(r.it))}</small>`:''}</div></div>`;}
 if(!rows.length)h+='<p class="hint">No shots yet. Add a camera setup and you’ll be asked how many cameras it uses. Each setup gets its own color.</p>';
 h+='<button class="addsu" data-act="newSetup">+ Add camera setup</button>';
 $('#shots').innerHTML=h;
}
function renderShotSel(){document.querySelectorAll('#listView tr[data-id]').forEach(r=>{const si=sel&&itemById(sel.id),on=!!sel&&sel.id===r.dataset.id&&(si&&si.type==='cam'?verStart(si,sel.mark||0):(sel.mark||0))===+r.dataset.v;r.classList.toggle('on',on);if(on&&mode==='split'){const lv=$('#listView'),t=r.offsetTop,h=r.offsetHeight;if(t<lv.scrollTop+40||t+h>lv.scrollTop+lv.clientHeight)lv.scrollTop=t-48;}});document.querySelectorAll('.sr[data-id]').forEach(r=>{const si=sel&&itemById(sel.id);r.classList.toggle('on',!!sel&&sel.id===r.dataset.id&&(si&&si.type==='cam'?verStart(si,sel.mark||0):(sel.mark||0))===+r.dataset.v);});}
$('#shots').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b);});
bindShotDrag($('#shots'),'.sr[data-id]');bindShotDrag($('#listView'),'tr[data-id]');

/* ---------- editing ---------- */
function findCam(id){for(const s of P.scenes){const it=s.items.find(i=>i.id===id);if(it)return {it,s};}return null;}
function setPage(it,v,add){
 const s=scene();
 if(v==='all'){it.pgs=null;return;}
 if(!add){it.pgs=[v];return;}
 if(!it.pgs)it.pgs=s.pages.map(p=>p.id).filter(id=>id!==v);
 else if(it.pgs.includes(v)){if(it.pgs.length>1)it.pgs=it.pgs.filter(x=>x!==v);}
 else it.pgs=s.pages.map(p=>p.id).filter(id=>id===v||it.pgs.includes(id));
 if(it.pgs&&it.pgs.length===s.pages.length)it.pgs=null;
}
function setField(f,v){
 const s=scene(),it=sel&&sel.id!=='__bg'?itemById(sel.id):null;
 switch(f){
  case 'char.name':{const c=charById(it.charId);if(c)c.name=v;break;}
  case 'char.color':{const c=charById(it.charId);if(c)c.color=v;break;}
  case 'v.size':case 'v.type':case 'v.angle':case 'v.move':case 'v.desc':(it.marks[sel.mark||0])[f.slice(2)]=v;break;
  case 'cam.letter':{const l=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,2);if(l)it.letter=l;break;}
  case 'cam.fov':{it.fov=+v;const fv=$('#fovv');if(fv)fv.textContent=v+'°';break;}
  case 'setup.color':{const st=setupIn(s,it.setupId);if(st)st.color=v;break;}
  case 'setup.num':{const st=setupIn(s,it.setupId),t=String(v).trim().toUpperCase().slice(0,6);if(st&&t)st.num=/^\d+$/.test(t)?+t:t;break;}
  case 'it.label':case 'it.fill':case 'it.color':case 'it.text':it[f.slice(3)]=v;break;
  case 'it.op':case 'it.size':case 'it.t':it[f.slice(3)]=+v;break;
  case 'it.reach':if(+v===0)it.beam=false;else{it.beam=true;it.reach=+v;}break;
  case 'it.trackbend':{it.bend=Math.abs(+v)<2?0:(+v)/100*Math.PI/it.w;const t=$('#tcrv');if(t)t.textContent=trackRadiusTxt(it)+' · or drag the ◆ in the middle of the track';break;}
  case 'it.trackft':{const f=Math.max(4,Math.round((+v||4)/4)*4);it.w=f*FT;it.h=TRACK_H;if(it.bend)it.bend=clamp(it.bend,-Math.PI/it.w,Math.PI/it.w);const t=$('#tpcs');if(t)t.textContent=trackPieces(f)+' · drag the corner handle to add or remove track';break;}
  case 'bg.op':s.bg.op=+v;break;
 }
 renderCanvas();
}
const insp=$('#insp');
insp.addEventListener('click',e=>{if(e.target.matches('input,select,textarea,label,.swc span'))return;const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b);});
insp.addEventListener('input',e=>{const t=e.target;if(t.dataset.f)setField(t.dataset.f,t.value);});
insp.addEventListener('change',e=>{const t=e.target;if(!t.dataset.f)return;
 if(t.type==='color'){commit();return;}commit({insp:false});});
function moveItem(it,mk,dx,dy){
 if(it.marks){if(mk==null)it.marks.forEach(m=>{m.x+=dx;m.y+=dy;});else if(it.type==='char'){const [a,b]=runOf(it,mk);for(let j=a;j<=b;j++){it.marks[j].x+=dx;it.marks[j].y+=dy;}}else{it.marks[mk].x+=dx;it.marks[mk].y+=dy;}}
 else if(it.type==='wall'){it.x1+=dx;it.y1+=dy;it.x2+=dx;it.y2+=dy;}
 else if(mk&&it.mv&&it.mv[mk-1]){it.mv[mk-1].x+=dx;it.mv[mk-1].y+=dy;}
 else{it.x+=dx;it.y+=dy;if(mk==='all')for(const q of (it.mv||[])){q.x+=dx;q.y+=dy;}}
}
function deleteSel(whole){
 if(!sel||sel.id==='__bg')return;const s=scene(),it=itemById(sel.id);if(!it)return;
 if(!whole&&it.marks&&it.marks.length>1){it.marks.splice(sel.mark,1);sel.mark=Math.min(sel.mark,it.marks.length-1);}
 else if(!whole&&!it.marks&&sel.mark&&it.mv){it.mv.splice(sel.mark-1,1);sel.mark=null;}
 else{s.items.splice(s.items.indexOf(it),1);if(it.type==='char')s.items=s.items.filter(x=>!(x.type==='axis'&&(x.a===it.id||x.b===it.id)));sel=null;}
 commit();
}
function select(id,mark){sel=id?{id,mark:mark==null?null:mark}:null;if(!sel)inspOpen=false;renderUI();renderInsp();renderShotSel();}
function act(a,b){
 const s=scene(),it=sel&&sel.id!=='__bg'?itemById(sel.id):null;
 switch(a){
  case 'color':setField(b.dataset.f,b.dataset.v);commit();break;
  case 'edit':openInsp();break;
  case 'closeInsp':inspOpen=false;renderInsp();break;
  case 'lock':if(sel.id==='__bg')s.bg.locked=!s.bg.locked;else if(it)it.locked=!it.locked;commit();break;
  case 'del':deleteSel(true);break;
  case 'moveMode':startTool({t:'move',id:it.id});break;
  case 'addVer':addVersion(it,sel.mark||0);break;
  case 'trackto':{const [,rb]=camRun(it,sel.mark||0);startTool({t:'move',id:it.id,tk:'to',at:rb});break;}
  case 'delMark':if(it.type==='char'){const [a,b]=runOf(it,sel.mark||0);if(it.marks.length>b-a+1){it.marks.splice(a,b-a+1);shiftAxis(s,it.id,b+1,-(b-a+1));if(a<it.marks.length&&it.marks[a].t)delete it.marks[a].t;sel.mark=Math.max(0,Math.min(a,it.marks.length-1));}}
  else if(it.type==='cam'){const [a,b]=camRun(it,sel.mark||0);if(nVer(it)>1){const kids=it.marks.map((q,j)=>q.sp&&j>b&&spBase(it,j)===a?j:-1).filter(j=>j>=0);if(kids.length){const K=it.marks[kids[0]];delete K.sp;K.mid=uid();for(const j of kids.slice(1))it.marks[j].sp=K.mid;}it.marks.splice(a,b-a+1);if(it.marks[0].tk)delete it.marks[0].tk;sel.mark=Math.min(a,it.marks.length-1);}}
  else if(it.marks){it.marks.splice(sel.mark,1);sel.mark=Math.min(sel.mark,it.marks.length-1);}else if(sel.mark&&it.mv){it.mv.splice(sel.mark-1,1);sel.mark=null;}commit();break;
  case 'front':s.items.splice(s.items.indexOf(it),1);s.items.push(it);commit();break;
  case 'back':s.items.splice(s.items.indexOf(it),1);s.items.unshift(it);commit();break;
  case 'dup':{const c=clone(it);c.id=uid();c.locked=false;moveItem(c,c.marks?null:'all',30,30);s.items.push(c);sel={id:c.id,mark:c.marks?0:null};commit();break;}
  case 'bgRemove':s.bgId=null;s.bg=null;sel=null;inspOpen=false;commit();break;
  case 'bgReplace':$('#fImg').click();break;
  case 'selCam':case 'goShot':{const c=findCam(b.dataset.id);if(!c)return;if(a==='goShot'&&mode==='list')setMode('diagram');const vi=Math.min(+b.dataset.v||0,c.it.marks.length-1);
   if(!vis(c.it,s)){s.pageId=(c.it.pgs&&c.it.pgs[0])||'all';saveLocal();render();fit();}sel={id:c.it.id,mark:vi};
   if(narrow())$('#app').classList.remove('side-open');renderUI();renderInsp();renderShotSel();break;}
  case 'sbAdd':pendingSb={id:b.dataset.id,vi:+b.dataset.v};$('#fSb').click();break;
  case 'sbDel':{const c=findCam(b.dataset.id);if(c){delete c.it.marks[+b.dataset.v].sb;commit();}break;}
  case 'labReset':delete it.lab;commit();break;
  case 'newSetup':setupDialog();break;
  case 'tstraight':it.bend=0;commit();break;
  case 'ctype':{const c=charById(it.charId);if(c){if(b.dataset.v)c.g=b.dataset.v;else delete c.g;}commit();break;}
  case 'pgset':setPage(it,b.dataset.v,!!(window.event&&(event.shiftKey||event.metaKey||event.ctrlKey)));if(!vis(it,s)){sel=null;inspOpen=false;}commit();break;
 }
}

/* ---------- tools: tap-to-place moves, wall drawing ---------- */
let tool=null;
const INK_COLS=['#E5484D','#F76B15','#F5C518','#30A46C','#3E63DD','#8E4EC6','#1C1C1E','#FFFFFF'],INK_W=[[2,'Fine'],[4,'Medium'],[8,'Thick']];
let penSeen=false;
function penBanner(){const c=P.ui.penCol||INK_COLS[0],w=P.ui.penW||4;$('#bannerTxt').innerHTML=`<span class="pent">Draw</span>${INK_COLS.map(x=>`<button class="penc${x===c?' on':''}" data-pc="${x}" style="--c:${x}" aria-label="Pen color"></button>`).join('')}<span class="pensep"></span>${INK_W.map(([v,l])=>`<button class="penw${v===w?' on':''}" data-pw="${v}" title="${l}"><i style="width:${v+3}px;height:${v+3}px"></i></button>`).join('')}`;}
$('#banner').addEventListener('click',e=>{const b=e.target.closest('[data-pc],[data-pw]');if(!b||!tool||tool.t!=='pen')return;if(b.dataset.pc)P.ui.penCol=b.dataset.pc;else P.ui.penW=+b.dataset.pw;saveLocal();penBanner();});
/* finish a stroke: the strokes of one drawing session make one drawing */
function penStroke(pts){if(pts.length===1)pts.push({x:pts[0].x+.5,y:pts[0].y+.5});const s=scene(),st={c:P.ui.penCol||INK_COLS[0],w:P.ui.penW||4,p:pts.map(q=>[q.x,q.y])};
 let it=tool.ink&&itemById(tool.ink);let all=[st];
 if(it){all=it.strokes.map(o=>({c:o.c,w:o.w,p:o.p.map(q=>[q[0]+it.x,q[1]+it.y])})).concat([st]);}
 let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const o of all)for(const q of o.p){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
 const cx=(x0+x1)/2,cy=(y0+y1)/2,w=Math.max(8,x1-x0),h=Math.max(8,y1-y0);
 const strokes=all.map(o=>({c:o.c,w:o.w,p:o.p.map(q=>[+(q[0]-cx).toFixed(1),+(q[1]-cy).toFixed(1)])}));
 if(!it){it={id:uid(),type:'ink',x:cx,y:cy,w,h,bw:w,bh:h,rot:0,ar:true,strokes,pgs:curPgs(),locked:false};s.items.push(it);tool.ink=it.id;}
 else Object.assign(it,{x:cx,y:cy,w,h,bw:w,bh:h,rot:0,strokes});
 commit({insp:false});}
function startTool(t){tool=t;closePop();inspOpen=false;renderInsp();
 if(t.t==='pen'){penBanner();$('#bannerDone').textContent='Done';$('#banner').classList.add('on');$('#bPen').classList.add('on');renderUI();return;}
 if(t.t==='move'){const it=itemById(t.id);const nm=it.type==='char'?String((charById(it.charId)||{}).name||'').toUpperCase():'';$('#bannerTxt').textContent=it.type==='char'?`Tap where ${nm} goes next.`:it.type==='cam'&&t.tk==='to'?'Tap where the camera tracks to.':it.type==='cam'&&t.tk==='from'?'Tap where the camera tracks in from.':it.type==='cam'?'Tap where the camera moves to. The new position becomes a new version.':'Tap where it moves to.';}
 else if(t.t==='from'){const it=itemById(t.id);$('#bannerTxt').textContent=`Tap where ${String((charById(it.charId)||{}).name||'').toUpperCase()} walks in from.`;}
 else if(t.t==='turn'){const it=itemById(t.id);$('#bannerTxt').textContent=`Tap the direction ${String((charById(it.charId)||{}).name||'').toUpperCase()} turns to.`;}
 else if(t.t==='axis')$('#bannerTxt').textContent='Tap the other character to draw the axis line.';
 else if(t.t==='pfrom')$('#bannerTxt').textContent='Tap where it moves in from.';
 else if(t.t==='pan')$('#bannerTxt').textContent=t.mode==='change'?'Tap the new direction for this turn.':'Tap the direction the camera pans to.';
 else $('#bannerTxt').textContent='Tap to place wall corners. It finishes by itself when it meets another corner. Or tap Done.';
 $('#bannerDone').textContent=t.t==='wall'?'Done':'Cancel';$('#banner').classList.add('on');renderUI();}
function endTool(){if(!tool)return;const was=tool;tool=null;$('#banner').classList.remove('on');$('#bPen').classList.remove('on');if(was.t==='pen'&&was.ink&&itemById(was.ink)){sel={id:was.ink,mark:null};}renderUI();}
$('#bannerDone').onclick=endTool;
function snapWall(w,skip){const r=16/view.k;let best=null,bd=r;for(const it of pageItems(scene()))if(it.type==='wall')for(const e of [1,2]){if(skip&&skip.some(q=>q.w===it&&q.e===e))continue;const p=wEnd(it,e),d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=p;}}return best?{x:best.x,y:best.y}:w;}
function snapAngle(o,w){const ang=Math.atan2(w.y-o.y,w.x-o.x)*180/Math.PI,sa=Math.round(ang/45)*45;if(Math.abs(ang-sa)<5){const L=Math.hypot(w.x-o.x,w.y-o.y);return {x:o.x+Math.cos(rad(sa))*L,y:o.y+Math.sin(rad(sa))*L};}return w;}
function toolTap(w){
 const s=scene();
 if(tool.t==='pfrom'){const it=itemById(tool.id);if(it){it.mv=[{x:it.x,y:it.y,rot:it.rot||0},...(it.mv||[])];it.x=w.x;it.y=w.y;sel={id:it.id,mark:null};}endTool();commit();return;}
 if(tool.t==='from'){const it=itemById(tool.id);const f=it.marks[0];it.marks.unshift({x:w.x,y:w.y,rot:Math.round(Math.atan2(f.y-w.y,f.x-w.x)*180/Math.PI/5)*5});for(const a of s.items)if(a.type==='axis'){if(a.a===it.id)a.am=(a.am||0)+1;if(a.b===it.id)a.bm=(a.bm||0)+1;}sel={id:it.id,mark:0};endTool();commit();return;}
 if(tool.t==='pan'){const it=itemById(tool.id),m=it&&it.marks[tool.mark||0];if(!m){endTool();return;}const ang=Math.round(Math.atan2(w.y-m.y,w.x-m.x)*180/Math.PI/5)*5,P=m.pans||(m.pans=[]),md=tool.mode,j=tool.pan||0;
  if(md==='change'){P[j-1].rot=ang;sel={id:it.id,mark:tool.mark,pan:j};endTool();commit();return;}
  const at=md==='before'?j-1:md==='after'?j:P.length,prev=at===0?(m.rot||0):P[at-1].rot,d=((ang-prev)%360+540)%360-180;
  if(Math.abs(d)<8){if(!P.length)delete m.pans;toast('That’s the way the camera already points. Tap further around it.');return;}
  P.splice(at,0,{rot:ang});if(!m.move)m.move='Pan';sel={id:it.id,mark:tool.mark,pan:at+1};endTool();commit();return;}
 if(tool.t==='turn'){const it=itemById(tool.id);if(!it){endTool();return;}const md=tool.mode||'add',j=tool.mark||0;let at=md==='before'?j:md==='after'?j+1:md==='add'?runOf(it,j)[1]+1:j;
  const base=it.marks[runOf(it,Math.min(j,it.marks.length-1))[0]],ang=Math.round(Math.atan2(w.y-base.y,w.x-base.x)*180/Math.PI/5)*5;
  if(md==='change'){it.marks[j].rot=ang;sel={id:it.id,mark:j};endTool();commit();return;}
  const prev=effFacing(it,at-1),d=((ang-prev)%360+540)%360-180;if(Math.abs(d)<8){toast('That’s the way they’re already facing. Tap further around them.');return;}
  shiftAxis(s,it.id,at,1);it.marks.splice(at,0,{x:base.x,y:base.y,rot:ang,t:1});sel={id:it.id,mark:at};endTool();commit();return;}
 if(tool.t==='axis'){const it=itemById(tool.id);let best=null,bd=40/Math.min(view.k,1);for(const o of pageItems(s))if(o.type==='char'&&o.id!==it.id)o.marks.forEach((m,mi)=>{const d=Math.hypot(m.x-w.x,m.y-w.y);if(d<bd){bd=d;best={o,mi};}});
  if(!best){toast('Tap another character to draw the axis line to.');return;}
  const ax={id:uid(),type:'axis',a:it.id,am:tool.mark,b:best.o.id,bm:best.mi,pgs:curPgs(),locked:false};s.items.push(ax);sel={id:ax.id,mark:null};endTool();commit();return;}
 if(tool.t==='move'&&!itemById(tool.id).marks){const it=itemById(tool.id),ps=positions(it),last=ps[ps.length-1];it.mv=it.mv||[];it.mv.push({x:w.x,y:w.y,rot:last.rot||0});sel={id:it.id,mark:it.mv.length};endTool();commit();return;}
 if(tool.t==='move'&&tool.tk){const it=itemById(tool.id);if(!it){endTool();return;}
  if(tool.tk==='to'){const b=tool.at,p=it.marks[b],m={x:w.x,y:w.y,rot:p.rot||0,tk:1};it.marks.splice(b+1,0,m);sel={id:it.id,mark:b+1};}
  else{const a=tool.at,old=it.marks[a],m={x:w.x,y:w.y,rot:old.rot||0};for(const k of VFIELDS)if(old[k]!==undefined){m[k]=old[k];delete old[k];}if(old.sp)m.sp=old.sp;if(old.mid){m.mid=old.mid;delete old.mid;}delete old.sp;old.tk=1;it.marks.splice(a,0,m);sel={id:it.id,mark:a};}
  endTool();commit();return;}
 if(tool.t==='move'){const it=itemById(tool.id);if(!it){endTool();return;}const last=it.marks[it.marks.length-1];
  const rot=it.type==='char'?Math.round(Math.atan2(w.y-last.y,w.x-last.x)*180/Math.PI/5)*5:(last.rot||0);
  const m={x:w.x,y:w.y,rot};if(it.type==='cam')Object.assign(m,{size:last.size||'',type:last.type||'',angle:last.angle||'',move:'',desc:''});
  it.marks.push(m);sel={id:it.id,mark:it.marks.length-1};endTool();commit();return;}
 if(tool.t==='wall'){const tp=wallToolPoint(w),p=tp.p,hit=tp.hit;if(!tool.last)tool.first={x:p.x,y:p.y};if(tool.last){if(Math.hypot(p.x-tool.last.x,p.y-tool.last.y)>6){s.items.push({id:uid(),type:'wall',x1:tool.last.x,y1:tool.last.y,x2:p.x,y2:p.y,t:WALL_T,pgs:null,locked:false});tool.last=p;commit();if(hit){endTool();toast('Wall connected.');}return;}if(hit){endTool();return;}}tool.last=p;renderUI();}
}

/* ---------- adding things ---------- */
function jitter(){const c=viewCenter(),n=scene().items.length%10,a=n*2.4,r=n?30+n*14:0;return {x:c.x+Math.cos(a)*r/view.k,y:c.y+Math.sin(a)*r/view.k};}
const curPg=()=>{const s=scene();return s.pageId==='all'?null:s.pageId;};
function addBox(kind){
 const L=LIB[kind],c=jitter(),type=kind==='mask'?'mask':kind==='text'?'text':catOf(kind);
 let o;
 if(type==='text')o={type:'text',x:c.x,y:c.y,text:'NOTE',size:18,color:'#2B2B2B',rot:0};
 else if(type==='mask')o={type:'mask',kind:'mask',x:c.x,y:c.y,w:L.w,h:L.h,rot:0,color:'#FFFFFF',op:1};
 else o={type,kind,x:c.x,y:c.y,w:kind==='dollytrack'?16*FT:L.w,h:kind==='dollytrack'?TRACK_H:L.h,rot:0,label:''};
 o.id=uid();o.locked=false;o.pgs=null;scene().items.push(o);if(isWallPiece(o))snapPiece(scene(),o,{x:o.x,y:o.y},160);sel={id:o.id,mark:null};if(type==='prop'){P.ui.recent=[kind,...(P.ui.recent||[]).filter(x=>x!==kind)].slice(0,8);}closePop();commit();

function natCmp(a,b){return String(a||'').localeCompare(String(b||''),undefined,{numeric:true,sensitivity:'base'});}
function liveScenes(){return P.scenes.filter(s=>!s.trashed&&!s.tpl);}
function trashed(){return P.scenes.filter(s=>s.trashed&&!s.tpl).sort((a,b)=>b.trashed-a.trashed);}
function fById(id){return id?P.folders.find(f=>f.id===id):null;}
function fParent(f){return f&&f.parent&&fById(f.parent)?f.parent:null;}
function sFolder(s){return s&&s.folder&&fById(s.folder)?s.folder:null;}
function fPath(id){const out=[];let f=fById(id),g=0;while(f&&g++<40){out.unshift(f);f=fById(fParent(f));}return out;}
function pathTxt(id){return fPath(id).map(f=>f.name).join(' › ');}
function fKids(id){id=id||null;return P.folders.filter(f=>fParent(f)===id).sort((a,b)=>natCmp(a.name,b.name));}
function fDesc(id){const set=new Set([id]);let grew=true;while(grew){grew=false;for(const f of P.folders){const pa=fParent(f);if(pa&&set.has(pa)&&!set.has(f.id)){set.add(f.id);grew=true;}}}return set;}
function sceneCmp(a,b){return natCmp(a.number,b.number)||natCmp(a.title,b.title);}
function fScenes(id){id=id||null;return liveScenes().filter(s=>sFolder(s)===id).sort(sceneCmp);}
function sceneLabel(s){return (s.number?'Sc. '+s.number+' · ':'')+(s.title||s.heading||'Untitled').toUpperCase();}
function rootOf(s){const p=fPath(sFolder(s));return p.length?p[0].id:null;}
function countIn(id){const d=fDesc(id);return liveScenes().filter(s=>d.has(sFolder(s))).length;}
function projectCast(s){const r=rootOf(s),ids=new Set();for(const x of liveScenes().concat([s]))if(x===s||rootOf(x)===r)for(const it of x.items)if(it.type==='char')ids.add(it.charId);return ids;}
function shotCount(s){return s.items.filter(i=>i.type==='cam').reduce((a,i)=>a+i.marks.length,0);}
function noteRecent(id){const r=(P.ui.recentScenes||[]).filter(x=>x!==id);r.unshift(id);P.ui.recentScenes=r.slice(0,10);}
function ensureLive(){
 const c=P.scenes.find(s=>s.id===P.sceneId);if(c&&!c.trashed)return;
 const live=liveScenes(),f=c?sFolder(c):null;
 let n=(P.ui.recentScenes||[]).map(id=>live.find(s=>s.id===id)).find(Boolean)||live.find(s=>sFolder(s)===f)||live[0];
 if(!n){n=blankScene(1);if(f)n.folder=f;P.scenes.push(n);}
 P.sceneId=n.id;sel=null;
}

function trashScenes(ids){const now=Date.now();for(const s of P.scenes)if(ids.includes(s.id))s.trashed=now;msel=null;ensureLive();}
function restoreScenes(ids){for(const s of P.scenes)if(ids.includes(s.id)){delete s.trashed;if(!sFolder(s))delete s.folder;}}

function ftInstall(){
 if((P.ui.ftv||0)>=FT_V)return false;
 for(const [L,c] of FT_CHARS)if(!P.characters.some(x=>x.id==='tplc-'+L))P.characters.push({id:'tplc-'+L,name:L,color:c,tpl:1});
 const hid=new Set(P.ui.ftHidden||[]);let added=0;
 for(const [key,cat,title,loc,make] of FT_DEFS){if(hid.has(key)||P.scenes.some(s=>s.id==='ft-'+key))continue;P.scenes.push(ftBuild(key,cat,title,loc,make));added++;}
 P.ui.ftv=FT_V;return added>0;
}
/* starting a scene from a template with stand-in characters: say who plays them */
function castDialog(n,done){
 const L=[...new Set(n.items.filter(i=>i.type==='char'&&/^tplc-/.test(i.charId)).map(i=>i.charId.slice(5)))].sort();
 if(!L.length){done();return;}
 const names=P.characters.filter(c=>!c.tpl&&!c.extra).map(c=>c.name).sort(natCmp);
 modal(`<h3>Who plays them?</h3><p class="mut">Pick someone from your cast or type a new name. Leave one blank to keep it as ${L.length>1?'a letter':'its letter'}.</p><datalist id="dl-cast">${names.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>${L.map(l=>`<label class="fld">${l}<input data-l="${l}" list="dl-cast" autocomplete="off" autocapitalize="characters" placeholder="e.g. TOMMY"></label>`).join('')}<div class="btns end"><button class="pri" id="ok">Start the scene</button></div>`,card=>{
  card.querySelector('#ok').onclick=()=>{const map={};
   for(const inp of card.querySelectorAll('[data-l]')){const l=inp.dataset.l,v=inp.value.trim()||l,ph=charById('tplc-'+l)||{color:CHAR_COLORS[0]};
    let c=P.characters.find(x=>!x.tpl&&String(x.name).toLowerCase()===v.toLowerCase());if(!c){c={id:uid(),name:v.toUpperCase(),color:ph.color};P.characters.push(c);}map['tplc-'+l]=c.id;}
   for(const it of n.items)if(it.type==='char'&&map[it.charId])it.charId=map[it.charId];closeModal();done();};
 });
}

function ftForget(t){if(t&&t.factory){P.ui.ftHidden=[...new Set([...(P.ui.ftHidden||[]),t.factory])];}}
function tplGroups(ts){return [['My Templates',ts.filter(t=>!t.cat)],...[...new Set(FT_DEFS.map(d=>d[1]))].map(c=>[c,ts.filter(t=>t.cat===c)])].filter(g=>g[1].length);}
function templates(){return P.scenes.filter(s=>s.tpl&&!s.trashed).sort((a,b)=>natCmp(a.title,b.title));}
function locKey(h){let t=String(h||'').toUpperCase().replace(/^\s*\d+[A-Z]?\.?\s+/,'').replace(/^\s*(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s+/,'').trim();
 const parts=t.split(/\s+[-–—]+\s+/);if(parts.length>1&&/^(DAY|NIGHT|MORNING|EVENING|AFTERNOON|DUSK|DAWN|LATER|CONTINUOUS|SAME|MOMENTS LATER|SUNSET|SUNRISE|MAGIC HOUR|SAME TIME|NEXT DAY|\()/.test(parts[parts.length-1]))parts.pop();
 return parts.join(' - ').replace(/\s*\([^)]*\)\s*$/,'').trim();}
function cloneScene(s){let j=JSON.stringify(stripScene(s));for(const id of [s.id,...s.items.map(i=>i.id)])j=j.split('"'+id+'"').join('"'+uid()+'"');const n=JSON.parse(j);delete n.trashed;migrateScene(n);return n;}
function tplMatches(t,target){const k=t.loc||locKey(t.heading);if(!k)return [];return liveScenes().filter(s=>s!==target&&rootOf(s)===rootOf(target)&&locKey(s.heading)===k&&!(s.tplApplied||[]).includes(t.id));}
function applyTemplate(t,target,replaceBg){
 const c=cloneScene(t),pg=target.pageId&&target.pageId!=='all'?target.pageId:target.pages[0].id,setI=[],actI=[];
 for(const it of c.items){if(ACTOR(it.type)||it.type==='axis'){it.pgs=[pg];actI.push(it);}else{it.pgs=null;setI.push(it);}}
 target.items=[...setI,...target.items,...actI];
 for(const st of (c.setups||[]))if(actI.some(i=>i.setupId===st.id))target.setups.push(st);
 if(c.bgId&&(!target.bgId||replaceBg)){target.bgId=c.bgId;target.bg=clone(c.bg);}
 target.tplApplied=[...(target.tplApplied||[]),t.id];
}
function sceneFromTemplate(t,folder){const n=cloneScene(t);delete n.tpl;delete n.loc;delete n.tplApplied;delete n.numbering;n.title='';n.tplApplied=[t.id];
 if(folder&&fById(folder))n.folder=folder;else delete n.folder;n.number=String(fScenes(folder||null).reduce((m,s)=>Math.max(m,parseInt(s.number,10)||0),0)+1);
 delete n.cat;delete n.factory;closeModal();castDialog(n,()=>{P.scenes.push(n);noteRecent(n.id);P.sceneId=n.id;sel=null;msel=null;inspOpen=false;endTool();closeModal();commit();fit();sceneInfo();});}

function brTemplates(){const ts=templates();if(!ts.length)return `<div class="brempty">No templates yet.<br><small>Open a scene with your set built, then Menu › Save as template. Standing sets you return to every episode are the best use.</small></div>`;

  for(let i=1;i<r.length;i++)if(/ $/.test(r[i-1].t)&&/^ /.test(r[i].t))r[i].t=r[i].t.slice(1);
  if(r.length){r[0].t=r[0].t.replace(/^ +/,'');r[r.length-1].t=r[r.length-1].t.replace(/ +$/,'');}
  r=r.filter(x=>x.t!=='');const m=[];for(const x of r){const L=m[m.length-1];if(L&&L.b===x.b&&L.i===x.i)L.t+=x.t;else m.push(x);}

   if(g&&(t0.length>g[0].length||m.length>1)){k='ul';m[0].t=t0.slice(g[0].length);}
   else{g=/^(\d{1,2})[.)]\s+/.exec(t0);if(g&&(t0.length>g[0].length||m.length>1)){k='ol';n=+g[1];m[0].t=t0.slice(g[0].length);}}
   if(m.length&&!m[0].t)m.shift();if(m.length)m[0].t=m[0].t.replace(/^ +/,'');}
  if(k==='ol'){if(pk==='ol'&&(!n||n===pn+1)){pn++;n=0;}else pn=n||1;}

function rtParse(html){

  if(tag==='I'||tag==='EM')i=/font-style\s*:\s*normal/i.test(sty)?0:1;else if(/font-style\s*:\s*italic/i.test(sty))i=1;

   const was=inLi;for(const c of n.childNodes){if(c.nodeType===1&&c.tagName==='LI'){flush();cur={k,r:[]};if(first&&start>1)cur.n=start;first=false;inLi=k;kids(c,ns);flush();inLi=was;}else if(c.nodeType===1)walk(c,ns);}
   return;}
  if(tag==='P'&&(/MsoList/i.test(n.className||'')||/mso-list/i.test(sty))){
   const mk=n.querySelector('[style*="mso-list"]'),mt=mk?mk.textContent.replace(/[\u00A0\s]+/g,''):'';
   flush();cur={k:/^\(?(\d+|[a-zA-Z])[.)]$/.test(mt)&&mt!=='o'?'ol':'ul',r:[]};kids(n,ns);flush();return;}
  if(RT_BLOCK.has(tag)){if(inLi){if(cur&&cur.r.some(x=>x.t.trim())){flush();cur={k:inLi,r:[]};}else if(!cur)cur={k:inLi,r:[]};kids(n,ns);return;}flush();cur={k:tag==='LI'?'ul':'p',r:[]};kids(n,ns);flush();return;}

}

  if(b.k==='p'){end();h+=`<p>${inner}${tail}</p>`;}

 const out=[];

/* --- where the text lives: P.text[sceneId]. Each cell carries its own version, so two devices merge cell by cell. --- */
const txOf=(id,make)=>{if(!P.text)P.text={};let x=P.text[id];if(!x&&make)x=P.text[id]={nb:{}};return x||null;};

function txBump(sid,key,c){c.vv=c.vv||{};c.vv[DEVICE]=(c.vv[DEVICE]||0)+1;delete c.a;c.t=Math.max(Date.now(),(c.t||0)+1);return c;}
/* 0 the same, 1 A is ahead, -1 B is ahead, 2 each has changes the other has not seen */
function vvCmp(A,B){let ge=true,le=true;const a=A.vv||{},b=B.vv||{};for(const d of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[d]||0,y=b[d]||0;if(x<y)ge=false;if(x>y)le=false;}return ge&&le?0:ge?1:le?-1:2;}
function vvMax(A,B){const o=Object.assign({},A.vv||{}),b=B.vv||{};for(const d in b)o[d]=Math.max(o[d]||0,b[d]);return o;}
let txTimer=null;

function txSaved(now){if(now){txFlush();return;}if(!txTimer)txTimer=setTimeout(txFlush,700);}

addEventListener('pagehide',()=>{if(txTimer)txFlush();});

function txDoc(sid){const x=P.text&&P.text[sid];if(!x)return null;const c=txCells(x);for(const k in c)if((c[k].t||0)>1)return {nb:x.nb||{},st:x.st||null};return null;}
const TX_MARK='<p><b>OTHER VERSION, edited on another device. Keep what you want and delete the rest:</b></p>';
function txSame(a,b){const f=c=>JSON.stringify([c.h||'',c.title||'',c.box?1:0,c.del?1:0,c.v||null,c.type||'',c.to||'',c.toNum||'']);return f(a)===f(b);}

  const L=Lf[key],r=Rf[key],lt=L?L.t||0:0,rt=r?r.t||0:0;

   if(txSame(L,r)||(r.a||[]).includes(lt)){take();continue;}

   c.vv=w?vvMax(c,w):Object.assign({},c.vv||{});c.vv[DEVICE]=(c.vv[DEVICE]||0)+1;delete c.a;c.t=Math.max(now,(w&&w.t||0)+1);}

function tlOf(sc,make){const pid=sc.pageId||'p';if(!sc.tl)sc.tl={};if(!sc.tl[pid]&&make)sc.tl[pid]={lab:{},spd:{}};return sc.tl[pid]||{lab:{},spd:{}};}
const spdV=v=>v==null?50:v<=5?[10,30,50,70,90][v-1]||50:v; /* 0-100, 50 is normal */

const LAYERS=[['char','Characters'],['arrow','Arrows'],['cam','Cameras'],['sb','Storyboards'],['prop','Props'],['set','Set'],['light','Lighting'],['ink','Drawings'],['label','Labels']];
