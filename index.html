/* VOICE: a working tool for set and scout days; the diagram is paper, the chrome stays out of the way

function colList(c){const all=[];SL_COLS.forEach(([k,l,p,d,fx],i)=>all.push({k,l,P:p,d:!!d,fx:!!fx,i}));(c.cc||[]).forEach((cc,j)=>all.push({k:'c:'+cc.id,l:cc.name,P:String(cc.name).toUpperCase(),cc,d:true,i:100+j}));
 const ord=c.order||[],ix=x=>{const q=ord.indexOf(x.k);return q>=0?q:1000+x.i;};return all.sort((a,b)=>ix(a)-ix(b));}
const colIsOn=(c,x)=>x.fx||((c.on||{})[x.k]!==undefined?!!c.on[x.k]:x.d);
function colsOn(s){const c=colCfg(s);return colList(c).filter(x=>colIsOn(c,x));}
function sceneCastIds(s){const out=[],add=id=>{if(id&&!out.includes(id)&&charById(id))out.push(id);};for(const id of s.cast||[])add(id);for(const c of shotCast(s))add(c.id);for(const it of s.items)if(it.type==='cam')for(const m of it.marks||[])for(const id of m.cast||[])add(id);return out;}
function shotCastIds(m){if(Array.isArray(m.cast))return m.cast.filter(id=>charById(id));if(m.on&&Array.isArray(m.on.who))return m.on.who.filter(id=>charById(id));return [];}
const castNames=m=>shotCastIds(m).map(id=>nmT(charById(id).name)).join(', ');
const minTxt=n=>!n?'':n<60?n+' min':Math.floor(n/60)+' h'+(n%60?' '+n%60+' min':'');
/* props to offer for a shot: labelled props on this scene's floor plan, and props already named on shots here or elsewhere in the project */
function propOpts(s){const root=rootOf(s),out=[],add=v=>{v=String(v||'').trim();if(v&&!out.some(x=>x.toLowerCase()===v.toLowerCase()))out.push(v);};
 const shots=sc=>{for(const it of sc.items)if(it.type==='cam')for(const q of it.marks||[])for(const v of q.props||[])add(v);};
 shots(s);for(const it of s.items)if(it.type==='prop'&&it.label)add(it.label);for(const sc of P.scenes)if(sc!==s&&rootOf(sc)===root)shots(sc);return out;}
const PRI=[['A','Must have'],['B','Should have'],['C','If there is time']];
/* the shot list can be narrowed to the top priorities; only while the Priority column is on, and it carries into the PDF */
const priF=s=>colsOn(s).some(c=>c.k==='pri')?(P.ui.priF||''):'';
function priRows(s,rows){const f=priF(s);return f?rows.filter(r=>f.includes(r.m.pri||'-')):rows;}
const priSel=(attrs,v,first)=>`<select ${attrs}>${first}${PRI.map(([p,l])=>`<option value="${p}"${v===p?' selected':''}>${p} · ${l}</option>`).join('')}</select>`;
const vaOn=()=>!!(P.ui&&P.ui.va);
const sensorOf=()=>SENSORS.find(x=>x[0]===prefGet('sensor'))||SENSORS[0];
const lensDeg=v=>{const f=lensMM(v);return f?2*Math.atan(sensorOf()[2]/(2*f))*180/Math.PI:0;};
function vaWedge(m,col){const d=lensDeg(m.lens);if(!d)return '';const h=rad(d/2),a=rad(m.rot||0),L=VA_FT*FT,p=t=>`${(m.x+Math.cos(t)*L).toFixed(1)},${(m.y+Math.sin(t)*L).toFixed(1)}`;
 return `<path class="deco va" d="M${m.x},${m.y}L${p(a-h)}A${L},${L} 0 0 1 ${p(a+h)}Z" fill="${col}" fill-opacity=".14" stroke="${col}" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="7 5" vector-effect="non-scaling-stroke"/>`;}
function cellVal(s,r,k){const m=r.m;switch(k){case 'gear':return (m.gear||[]).join(', ');case 'props':return (m.props||[]).join(', ');case 'cast':return castNames(m);case 'time':return minTxt(+m.time||0);case 'flag':return m.flag?'★':'';case 'vfx':return m.vfx?'VFX':'';case 'sfx':return m.sfx?'SFX':'';
 case 'ss':return m.ss&&m.ss!=='plan'?((SS.find(x=>x[0]===m.ss)||[])[1]||''):'';default:if(k.startsWith('c:'))return String((m.cx||{})[k.slice(2)]||'');return String(m[k]||'');}}
const vlabel=m=>[m.size?(ABBR[m.size]||m.size):'',m.type].filter(Boolean).join(' ').toUpperCase();
function sizeSelect(attrs,val){const known=val in ABBR;return `<select ${attrs}><option value=""${val?'':' selected'}>—</option>${!val||known?'':`<option selected>${esc(val)}</option>`}${SIZE_GROUPS.map(([g,l])=>`<optgroup label="${g}">${l.map(([n])=>`<option${n===val?' selected':''}>${n}</option>`).join('')}</optgroup>`).join('')}</select>`;}

/* ---------- props drawn at their real size, in one style: tones of a single color, a dark outline, a soft shadow that always falls the same way ---------- */
const NINK='#3b4250',nS=`stroke="${NINK}" stroke-width="1.25" vector-effect="non-scaling-stroke" stroke-linejoin="round"`,NS0='stroke="none"';
const nT=o=>`fill="none" stroke="${NINK}" stroke-opacity="${o==null?.4:o}" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linecap="round"`;
const nf=v=>+(+v).toFixed(1),lt=(c,f)=>shade(c,f),dk=(c,f)=>shade(c,-f);
const nR=(x,y,w,h,r,fill,ex)=>`<rect x="${nf(x)}" y="${nf(y)}" width="${nf(Math.max(0,w))}" height="${nf(Math.max(0,h))}" rx="${nf(Math.max(0,Math.min(r||0,w/2,h/2)))}" fill="${fill}" ${ex==null?nS:ex}/>`;
const nC=(x,y,r,fill,ex)=>`<circle cx="${nf(x)}" cy="${nf(y)}" r="${nf(Math.max(0,r))}" fill="${fill}" ${ex==null?nS:ex}/>`;
const nEl=(x,y,rx,ry,fill,ex)=>`<ellipse cx="${nf(x)}" cy="${nf(y)}" rx="${nf(Math.max(0,rx))}" ry="${nf(Math.max(0,ry))}" fill="${fill}" ${ex==null?nS:ex}/>`;
const nP=(d,fill,ex)=>`<path d="${d}" fill="${fill}" ${ex==null?nS:ex}/>`;
const nL=(d,o)=>`<path d="${d}" ${nT(o)}/>`;
const NSH='opacity=".11"';
const nSh=(o,x,y,w,h,r)=>nR(x+o.sx,y+o.sy,w,h,r,'#000',NSH),nShC=(o,x,y,r)=>nC(x+o.sx,y+o.sy,r,'#000',NSH);
const nShP=(o,d,k)=>`<path d="${d}" fill="#000" opacity=".11" transform="translate(${nf(o.sx*(k||1))},${nf(o.sy*(k||1))})"/>`;
const nFlip=o=>({sx:-o.sx,sy:-o.sy});
const nHi=(x,y,w,h,r)=>`<rect x="${nf(x)}" y="${nf(y)}" width="${nf(Math.max(0,w))}" height="${nf(Math.max(0,h))}" rx="${nf(Math.max(0,r))}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
/* seating */
function nChair(w,h,c,o){const x=-w/2,y=-h/2,l=Math.min(3,w*.08);let g='';
 for(const a of [x+w*.12,-x-w*.12])for(const b of [y+h*.16,-y-h*.1])g+=nC(a,b,l,dk(c,.45),NS0);
 return g+nSh(o,x+w*.07,y+h*.12,w*.86,h*.86,8)+nR(x+w*.07,y+h*.12,w*.86,h*.86,Math.min(8,w*.2),lt(c,.4))+nR(x+w*.02,y,w*.96,Math.min(10,h*.24),5,c);}
function nSofa(w,h,c,o){const x=-w/2,y=-h/2,arm=Math.min(13,w*.2),r=Math.min(9,h*.16,w*.16),bk=Math.min(15,h*.26),n=Math.max(1,Math.round((w-2*arm)/44)),cw=(w-2*arm)/n;
 let g=nSh(o,x,y,w,h,r)+nR(x,y,w,h,r,dk(c,.12))+nR(x+arm-2,y+3,w-2*arm+4,bk,6,lt(c,.1));
 for(let i=0;i<n;i++)g+=nR(x+arm+i*cw+1,y+bk+4,cw-2,h-bk-8,6,lt(c,.26));
 return g+nR(x,y+h*.1,arm,h*.87,6,c)+nR(-x-arm,y+h*.1,arm,h*.87,6,c);}
function nBench(w,h,c,o){const x=-w/2,y=-h/2;let d='';for(const t of [.34,.66])d+=`M${nf(x+3)},${nf(y+h*t)}H${nf(-x-3)}`;
 return nSh(o,x,y,w,h,4)+nR(x,y,w,h,4,lt(c,.12))+nL(d,.35)+nR(x+w*.06,y,5,h,2,dk(c,.2))+nR(-x-w*.06-5,y,5,h,2,dk(c,.2));}
function nStool(w,h,c,o){const r=Math.min(w,h)/2;return nShC(o,0,0,r)+nC(0,0,r,dk(c,.1))+nC(0,0,r*.72,lt(c,.28))+`<circle r="${nf(r*.72)}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1" vector-effect="non-scaling-stroke"/>`;}
function nDirChair(w,h,c,o){const x=-w/2,y=-h/2,wd='#a67c52';
 return nSh(o,x+w*.1,y+h*.1,w*.8,h*.84,3)+nL(`M${nf(x+w*.14)},${nf(y+h*.2)}L${nf(-x-w*.14)},${nf(-y-h*.08)}M${nf(-x-w*.14)},${nf(y+h*.2)}L${nf(x+w*.14)},${nf(-y-h*.08)}`,.5)+nR(x+w*.13,y+h*.2,w*.74,h*.7,3,lt(c,.18))+nR(x+w*.1,y+h*.02,w*.8,h*.17,3,c)+nR(x,y+h*.08,w*.12,h*.84,3,wd)+nR(-x-w*.12,y+h*.08,w*.12,h*.84,3,wd);}
function nWheelchair(w,h,c,o){const x=-w/2,y=-h/2,tire='#2b2d33';
 return nSh(o,x+w*.14,y+h*.04,w*.72,h*.76,6)+nR(x,y+h*.1,w*.13,h*.7,4,tire)+nR(-x-w*.13,y+h*.1,w*.13,h*.7,4,tire)+nR(x+w*.16,y+h*.1,w*.68,h*.66,6,lt(c,.22))+nR(x+w*.13,y+h*.01,w*.74,h*.13,4,c)
  +nL(`M${nf(x+w*.3)},${nf(y+h*.76)}V${nf(y+h*.86)}M${nf(-x-w*.3)},${nf(y+h*.76)}V${nf(y+h*.86)}`,.7)+nR(x+w*.2,y+h*.86,w*.22,h*.12,3,'#8d96a1')+nR(-x-w*.42,y+h*.86,w*.22,h*.12,3,'#8d96a1');}
function nBooth(w,h,c,o){const x=-w/2,y=-h/2,tw=w*.16,th=h*.16,U=`M${nf(x)},${nf(y+6)}Q${nf(x)},${nf(y)} ${nf(x+6)},${nf(y)}H${nf(-x-6)}Q${nf(-x)},${nf(y)} ${nf(-x)},${nf(y+6)}V${nf(-y)}H${nf(-x-tw)}V${nf(y+th)}H${nf(x+tw)}V${nf(-y)}H${nf(x)}Z`;
 return nShP(o,U)+nP(U,dk(c,.12))+nR(x+tw*.34,y+th*.28,w-tw*.68,th*.6,5,lt(c,.2))+nR(x+tw*.34,y+th+1,tw*.52,h-th-5,5,lt(c,.2))+nR(-x-tw*.86,y+th+1,tw*.52,h-th-5,5,lt(c,.2))
  +nSh(o,x+w*.27,y+h*.3,w*.46,h*.58,5)+nR(x+w*.27,y+h*.3,w*.46,h*.58,5,'#c9a27a')+nHi(x+w*.27+4,y+h*.3+4,w*.46-8,h*.58-8,3);}
function nCafe(w,h,c,o){const cs=Math.min(w*.6,h*.33,44),r=Math.min(w*.43,(h-cs*1.1)/2*.98);
 return `<g transform="translate(0,${nf(-h/2+cs/2)})">${nChair(cs,cs,'#8c6239',o)}</g><g transform="translate(0,${nf(h/2-cs/2)}) rotate(180)">${nChair(cs,cs,'#8c6239',nFlip(o))}</g>`+nShC(o,0,0,r)+nC(0,0,r,c)+`<circle r="${nf(Math.max(0,r-4))}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1" vector-effect="non-scaling-stroke"/>`;}
/* tables and case goods */
function nGrain(x,y,w,h){let d='';for(const t of [.3,.52,.74])d+=`M${nf(x+w*.16)},${nf(y+h*t)}Q0,${nf(y+h*(t-.07))} ${nf(-x-w*.16)},${nf(y+h*t)}`;return nL(d,.14);}
function nTable(w,h,c,o,r){const x=-w/2,y=-h/2;return nSh(o,x,y,w,h,r)+nR(x,y,w,h,r,c)+nHi(x+4,y+4,w-8,h-8,Math.max(0,r-3))+nGrain(x,y,w,h);}
function nOval(w,h,c,o){return nEl(o.sx,o.sy,w/2,h/2,'#000',NSH)+nEl(0,0,w/2,h/2,c)+`<ellipse rx="${nf(Math.max(0,w/2-4))}" ry="${nf(Math.max(0,h/2-4))}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1" vector-effect="non-scaling-stroke"/>`+nGrain(-w/2,-h/2,w,h);}
function nConf(w,h,c,o){const x=-w/2,y=-h/2,cs=Math.min(30,h*.27),n=Math.max(2,Math.round(w/54));let g='';
 for(let i=0;i<n;i++){const cx=x+w*.1+w*.8*(i+.5)/n;g+=`<g transform="translate(${nf(cx)},${nf(y+cs/2)})">${nChair(cs,cs,'#5b6573',o)}</g><g transform="translate(${nf(cx)},${nf(-y-cs/2)}) rotate(180)">${nChair(cs,cs,'#5b6573',nFlip(o))}</g>`;}
 const ty=y+cs*.62,th=h-cs*1.24;return g+nSh(o,x+w*.03,ty,w*.94,th,th*.34)+nR(x+w*.03,ty,w*.94,th,th*.34,c)+nHi(x+w*.03+5,ty+5,w*.94-10,th-10,th*.3)+nGrain(x+w*.03,ty,w*.94,th);}
function nDesk(w,h,c,o){const x=-w/2,y=-h/2;return nTable(w,h,c,o,3)+nL(`M${nf(x+w*.66)},${nf(y+2)}V${nf(-y-2)}`,.45)+nR(x+w*.79,-y-5,w*.1,2.2,1,dk(c,.45),NS0);}
function nNight(w,h,c,o){const r=Math.min(w,h);return nTable(w,h,c,o,4)+nC(0,0,r*.27,'#fff3c4')+nC(0,0,r*.1,'#e8c468');}
function nDresser(w,h,c,o){const x=-w/2,y=-h/2,n=Math.max(2,Math.round(w/30));let d='',g='';for(let i=1;i<n;i++)d+=`M${nf(x+w*i/n)},${nf(y+2)}V${nf(-y-2)}`;for(let i=0;i<n;i++)g+=nC(x+w*(i+.5)/n,-y-h*.16,1.7,dk(c,.5),NS0);
 return nSh(o,x,y,w,h,3)+nR(x,y,w,h,3,c)+nHi(x+3,y+3,w-6,h-6,2)+nL(d,.4)+g;}
function nShelf(w,h,c,o){const x=-w/2,y=-h/2,n=Math.max(3,Math.floor((w-6)/7)),bw=(w-6)/n,B=['#8e2f35','#2f5d8a','#d9a520','#3f7d3a','#6b5b95','#b5534a','#4b5563','#c08a55'];let g='';
 for(let i=0;i<n;i++){const k=(i*7+3)%8,t=.5+((i*5)%4)*.11;g+=nR(x+3+i*bw+.4,y+3+(h-6)*(1-t),bw-.8,(h-6)*t,.8,B[k],'stroke="#000" stroke-opacity=".25" stroke-width=".6" vector-effect="non-scaling-stroke"');}
 return nSh(o,x,y,w,h,2)+nR(x,y,w,h,2,dk(c,.1))+nR(x+2.5,y+2.5,w-5,h-5,1,dk(c,.42),NS0)+g;}
function nTV(w,h,c,o){const x=-w/2,y=-h/2;return nR(-w*.2,y+h*.5,w*.4,h*.48,3,'#7b8290')+nSh(o,x,y,w,h*.5,2)+nR(x,y,w,h*.5,2,c)+`<path d="M${nf(x+4)},${nf(y+h*.14)}H${nf(-x-4)}" stroke="#fff" stroke-opacity=".3" stroke-width="1" vector-effect="non-scaling-stroke"/>`;}
function nRug(w,h,c,o){const x=-w/2,y=-h/2,i1=Math.min(8,w*.07,h*.1),i2=i1*1.8;let d='';const n=Math.max(4,Math.round(h/7));for(let i=0;i<=n;i++){const yy=y+h*i/n;d+=`M${nf(x-4)},${nf(yy)}H${nf(x)}M${nf(-x)},${nf(yy)}H${nf(-x+4)}`;}
 return `<path d="${d}" stroke="${dk(c,.2)}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`+nR(x,y,w,h,3,c)+nR(x+i1,y+i1,w-2*i1,h-2*i1,2,lt(c,.14),`stroke="${dk(c,.3)}" stroke-width="1" vector-effect="non-scaling-stroke"`)+nR(x+i2,y+i2,w-2*i2,h-2*i2,1,'none',`stroke="#fff" stroke-opacity=".45" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="4 3"`);}
function nLeaf(w,h,c,o,n,k){const R=Math.min(w,h)/2,sy=h/w;return `<g transform="scale(${w>=h?nf(w/h):1},${h>w?nf(h/w):1})">`+nShP(o,scallop(0,0,R*.84,n),k||1)+nP(scallop(0,0,R*.84,n),dk(c,.1))+nP(scallop(-R*.1,-R*.12,R*.56,Math.max(6,n-3)),lt(c,.16),NS0)+nP(scallop(-R*.2,-R*.24,R*.28,6),lt(c,.34),NS0)+'</g>';}
function nPlant(w,h,c,o){const R=Math.min(w,h)/2;return nLeaf(w,h,c,o,9)+nC(0,0,R*.3,'#b5651d')+nC(0,0,R*.17,'#6b4a2f',NS0);}
function nTree(w,h,c,o){const R=Math.min(w,h)/2;return nLeaf(w,h,c,o,13,2.4)+nC(0,0,R*.07,'#6b4a2f',NS0);}
function nHedge(w,h,c,o){const x=-w/2,y=-h/2,r=Math.min(h*.42,w*.2),n=Math.max(2,Math.round(w/(h*.8)));let g='';for(let i=0;i<n;i++)g+=nEl(x+w*(i+.5)/n-h*.06,-h*.08,Math.min(w/n*.42,h*.5),h*.28,lt(c,.16),NS0);

 return nSh(o,x,y+h*.06,kw,h*.88,2)+nR(x,y+h*.06,kw,h*.88,2,c)+nLw(d,.4)+nSh(o,x+w*.83,y+h*.22,w*.15,h*.56,4)+nR(x+w*.83,y+h*.22,w*.15,h*.56,4,lt(c,.55));}

 return g+nSh(o,r*.18,-r*.8,r*.55,r*.72,2)+nR(r*.18,-r*.8,r*.55,r*.72,2,'#cfe6f5')+nR(r*.3,-r*.5,r*.31,r*.3,1,'#8fc0e0',NS0)+nC(0,0,r*.2,lt(c,.25));}

 return nShP(o,d)+nP(d,c)+nR(x+w*.26,y,w*.48,h*.07,0,dk(c,.4),NS0)+nR(x+w*.14,y+h*.58,w*.72,h*.22,0,'#f3efe4','stroke="none" fill-opacity=".9"');}

function nStroller(w,h,c,o){const x=-w/2,y=-h/2;let g='';for(const a of [x+w*.1,-x-w*.1])for(const b of [y+h*.2,y+h*.66])g+=nR(a-w*.07,b-h*.06,w*.14,h*.12,2,NTIRE,NS0);
 return g+nSh(o,x+w*.12,y+h*.04,w*.76,h*.7,w*.3)+nR(x+w*.12,y+h*.04,w*.76,h*.7,w*.3,lt(c,.25))+nP(`M${nf(x+w*.12)},${nf(y+h*.36)}V${nf(y+h*.22)}Q${nf(x+w*.12)},${nf(y+h*.04)} 0,${nf(y+h*.04)}Q${nf(-x-w*.12)},${nf(y+h*.04)} ${nf(-x-w*.12)},${nf(y+h*.22)}V${nf(y+h*.36)}Z`,c)
  +nSeg(x+w*.26,y+h*.74,x+w*.26,-y-h*.05,w*.06,NMETAL)+nSeg(-x-w*.26,y+h*.74,-x-w*.26,-y-h*.05,w*.06,NMETAL)+nSeg(x+w*.22,-y-h*.05,-x-w*.22,-y-h*.05,w*.09,NTIRE,NS0);}
/* animals, seen from above, heading right */
function nAnimal(w,h,c,o,t){const horse=t==='horse',cat=t==='cat',bx=horse?-w*.06:-w*.08,brx=horse?w*.3:w*.29,bry=h*(horse?.36:.33),hx=horse?w*.38:w*.31,hr=h*(horse?.17:cat?.34:.27),hrx=horse?w*.085:Math.min(w*.13,hr*1.05);
 let g=nEl(bx+o.sx,o.sy,brx,bry,'#000',NSH)+nEl(hx+o.sx,o.sy,hrx,hr,'#000',NSH);
 /* tail */
 g+=horse?nP(`M${nf(bx-brx*.95)},${nf(-h*.06)}Q${nf(-w*.47)},${nf(-h*.12)} ${nf(-w*.5)},0Q${nf(-w*.47)},${nf(h*.12)} ${nf(bx-brx*.95)},${nf(h*.06)}Z`,dk(c,.4))
   :nP(`M${nf(bx-brx*.92)},${nf(-h*.05)}Q${nf(-w*.44)},${nf(-h*.1)} ${nf(-w*.47)},${nf(-h*(cat?.44:.34))}Q${nf(-w*.4)},${nf(-h*.2)} ${nf(bx-brx*.85)},${nf(h*.05)}Z`,dk(c,.12));
 /* neck (horse), body */
 if(horse)g+=nP(`M${nf(w*.18)},${nf(-h*.2)}L${nf(hx)},${nf(-hr*.8)}L${nf(hx)},${nf(hr*.8)}L${nf(w*.18)},${nf(h*.2)}Z`,c);
 g+=nEl(bx,0,brx,bry,c);
 if(horse)g+=nEl(bx,0,brx*.34,bry*.62,dk(c,.34))+nL(`M${nf(w*.2)},0H${nf(hx)}`,.55);
 /* ears, head, muzzle */
 for(const s of [-1,1])g+=cat?nP(`M${nf(hx-hrx*.5)},${nf(s*hr*.7)}L${nf(hx+hrx*.05)},${nf(s*hr*1.35)}L${nf(hx+hrx*.5)},${nf(s*hr*.6)}Z`,dk(c,.18)):horse?nEl(hx-hrx*.5,s*hr*.75,hrx*.3,hr*.3,dk(c,.25)):nEl(hx-hrx*.25,s*hr*.95,hrx*.42,hr*.42,dk(c,.3));
 g+=nEl(hx,0,hrx,hr,lt(c,.07));
 g+=horse?nEl(hx+hrx*1.1,0,hrx*.8,hr*.62,lt(c,.07))+nEl(hx+hrx*1.55,0,hrx*.3,hr*.44,dk(c,.35),NS0)
   :nEl(hx+hrx*.8,0,hrx*.45,hr*.5,lt(c,.22))+nC(hx+hrx*1.18,0,Math.max(.6,hr*.14),NTIRE,NS0);
 return g;}

function ftInstall(){
 if((P.ui.ftv||0)>=FT_V)return false;
 for(const [L,c] of FT_CHARS)if(!P.characters.some(x=>x.id==='tplc-'+L))P.characters.push({id:'tplc-'+L,name:L,color:c,tpl:1});
 const hid=new Set(P.ui.ftHidden||[]);let added=0;
 for(const [key,cat,title,loc,make] of FT_DEFS){if(hid.has(key)||P.scenes.some(s=>s.id==='ft-'+key))continue;P.scenes.push(ftBuild(key,cat,title,loc,make));added++;}
 P.ui.ftv=FT_V;return added>0;
}
/* starting a scene from a template with stand-in characters: say who plays them */
function castDialog(n,done){
 const L=[...new Set(n.items.filter(i=>i.type==='char'&&/^tplc-/.test(i.charId)).map(i=>i.charId.slice(5)))].sort();
 if(!L.length){done();return;}
 const proot=rootKey(scene()),names=[...new Set(P.characters.filter(c=>!c.extra&&inRoot(c,proot)).map(c=>c.name))].sort(natCmp);
 modal(`<h3>Who plays them?</h3><p class="mut">Pick someone from your cast or type a new name. Leave one blank to keep it as ${L.length>1?'a letter':'its letter'}.</p><datalist id="dl-cast">${names.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>${L.map(l=>`<label class="fld">${l}<input data-l="${l}" list="dl-cast" autocomplete="off" autocapitalize="characters" placeholder="e.g. TOMMY"></label>`).join('')}<div class="btns end"><button class="pri" id="ok">Start the scene</button></div>`,card=>{
  card.querySelector('#ok').onclick=()=>{const map={};
   for(const inp of card.querySelectorAll('[data-l]')){const l=inp.dataset.l,v=inp.value.trim()||l,ph=charById('tplc-'+l)||{color:CHAR_COLORS[0]};
    let c=P.characters.find(x=>!x.extra&&inRoot(x,proot)&&String(x.name).toLowerCase()===v.toLowerCase());if(!c){c={id:uid(),name:v.toUpperCase(),color:ph.color,home:proot};P.characters.push(c);}map['tplc-'+l]=c.id;}
   for(const it of n.items)if(it.type==='char'&&map[it.charId])it.charId=map[it.charId];closeModal();done();};
 });
}

function ftForget(t){if(t&&t.factory){P.ui.ftHidden=[...new Set([...(P.ui.ftHidden||[]),t.factory])];}}
function tplGroups(ts){return [['My Templates',ts.filter(t=>!t.cat)],...[...new Set(FT_DEFS.map(d=>d[1]))].map(c=>[c,ts.filter(t=>t.cat===c)])].filter(g=>g[1].length);}
function templates(){return P.scenes.filter(s=>s.tpl&&!s.trashed).sort((a,b)=>natCmp(a.title,b.title));}
function locKey(h){let t=String(h||'').toUpperCase().replace(/^\s*\d+[A-Z]?\.?\s+/,'').replace(/^\s*(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s+/,'').trim();
 const parts=t.split(/\s+[-–—]+\s+/);if(parts.length>1&&/^(DAY|NIGHT|MORNING|EVENING|AFTERNOON|DUSK|DAWN|LATER|CONTINUOUS|SAME|MOMENTS LATER|SUNSET|SUNRISE|MAGIC HOUR|SAME TIME|NEXT DAY|\()/.test(parts[parts.length-1]))parts.pop();
 return parts.join(' - ').replace(/\s*\([^)]*\)\s*$/,'').trim();}
function cloneScene(s){let j=JSON.stringify(stripScene(s));for(const id of [s.id,...s.items.map(i=>i.id),...(s.setups||[]).map(x=>x.id)])j=j.split('"'+id+'"').join('"'+uid()+'"');const n=JSON.parse(j);delete n.trashed;migrateScene(n);return n;}
function tplMatches(t,target){const k=t.loc||locKey(t.heading);if(!k)return [];return liveScenes().filter(s=>s!==target&&rootOf(s)===rootOf(target)&&locKey(s.heading)===k&&!(s.tplApplied||[]).includes(t.id));}
function applyTemplate(t,target,replaceBg){
 const c=cloneScene(t),pg=target.pageId&&target.pageId!=='all'?target.pageId:target.pages[0].id,setI=[],actI=[];
 for(const it of c.items){if(ACTOR(it.type)||it.type==='axis'){it.pgs=target.pageId==='all'?null:[pg];actI.push(it);}else{it.pgs=null;setI.push(it);}}
 target.items=[...setI,...target.items,...actI];
 for(const st of (c.setups||[]))if(actI.some(i=>i.setupId===st.id))target.setups.push(st);
 if(c.bgId&&(!target.bgId||replaceBg)){target.bgId=c.bgId;target.bg=clone(c.bg);}
 target.tplApplied=[...(target.tplApplied||[]),t.id];
}
function sceneFromTemplate(t,folder){const n=cloneScene(t);n.pageId='all';if(n.pages.length===1)for(const i of n.items)if(i.pgs)i.pgs=null;delete n.tpl;delete n.loc;delete n.tplApplied;delete n.numbering;n.title='';n.tplApplied=[t.id];
 if(folder&&fById(folder))n.folder=folder;else delete n.folder;n.number=String(fScenes(folder||null).reduce((m,s)=>Math.max(m,parseInt(s.number,10)||0),0)+1);
 delete n.cat;delete n.factory;closeModal();castDialog(n,()=>{P.scenes.push(n);noteRecent(n.id);P.sceneId=n.id;sel=null;msel=null;inspOpen=false;endTool();closeModal();commit();fit();sceneInfo();});}
function saveTemplateDialog(){const s=scene(),lk=locKey(s.heading),hasActors=s.items.some(i=>ACTOR(i.type));
 modal(`<h3>Save as template</h3><p class="mut">Keeps this scene’s set so you can start new scenes from it or add it to scenes you already have.</p>
  <label class="fld">Template name<input id="tN" value="${esc(lk||s.title||'Set')}" autocomplete="off"></label>
  <label class="fld">Location it’s for<input id="tL" value="${esc(lk)}" placeholder="e.g. PRECINCT - BULLPEN" autocomplete="off" autocapitalize="characters"></label>
  <p class="mut" style="font-size:12.5px">Scenes whose heading matches this location are offered the template, including scenes from scripts you import later.</p>
  <label class="imopt"><input type="checkbox" id="tA"${hasActors?'':' disabled'}> Also keep the characters and cameras</label>
  <div class="btns end"><button data-x>Cancel</button><button class="pri" id="tOk">Save template</button></div>`,card=>{
  card.querySelector('#tOk').onclick=()=>{const name=card.querySelector('#tN').value.trim()||'Set',loc=card.querySelector('#tL').value.trim().toUpperCase(),actors=card.querySelector('#tA').checked;
   const t=cloneScene(s);if(!actors){t.items=t.items.filter(i=>!(ACTOR(i.type)||i.type==='axis'));t.setups=[];t.pages=[t.pages[0]];t.pageId=t.pages[0].id;t.items.forEach(i=>i.pgs=null);}
   Object.assign(t,{tpl:true,title:name,loc,number:''});delete t.folder;delete t.tplApplied;delete t.numbering;P.scenes.push(t);
   s.tplApplied=[...(s.tplApplied||[]),t.id];closeModal();commit();toast(`Template “${name}” saved. Find it under Open Scene › Templates.`);};});}
function applyTemplateDialog(t){const s=scene();if(s.tpl){toast('This is a template. Open a scene to add a template to it.');return;}
 const others=tplMatches(t,s),k=t.loc||locKey(t.heading),bgBoth=t.bgId&&s.bgId&&t.bgId!==s.bgId;
 modal(`<h3>Add “${esc(t.title)}” to this scene</h3><p class="mut">Adds the template’s floor plan, walls and set pieces${t.items.some(i=>ACTOR(i.type))?', characters and cameras':''} to ${esc(sceneLabel(s))}.</p>
  ${bgBoth?'<label class="imopt"><input type="checkbox" id="aBg"> Replace this scene’s floor plan image with the template’s</label>':''}
  ${others.length?`<label class="imopt"><input type="checkbox" id="aAll" checked> Also add it to the ${plural(others.length,'other scene')} at ${esc(k)} in this project</label>`:''}
  <div class="btns end"><button data-x>Cancel</button><button class="pri" id="aOk">Add template</button></div>`,card=>{
  card.querySelector('#aOk').onclick=()=>{const rb=!!(card.querySelector('#aBg')||{}).checked,all=!!(card.querySelector('#aAll')||{}).checked;applyTemplate(t,s,rb);let n=1;if(all)for(const o of others){applyTemplate(t,o,false);n++;}closeModal();commit();fit();toast(n>1?`Added to ${plural(n,'scene')}. Undo takes it all back.`:'Template added.');};});}
function pickTemplateDialog(){const s=scene(),ts=templates();if(!ts.length){toast('No templates yet. Use Menu › This Scene › Save as Template… on a scene with your set.');return;}
 const k=locKey(s.heading),m=t=>k&&(t.loc||locKey(t.heading))===k;ts.sort((a,b)=>m(b)-m(a));

   else{g=/^(\d{1,2})[.)]\s+/.exec(t0);if(g&&(t0.length>g[0].length||m.length>1)){k='ol';n=+g[1];m[0].t=t0.slice(g[0].length);}}
   if(m.length&&!m[0].t)m.shift();if(m.length)m[0].t=m[0].t.replace(/^ +/,'');}

  <div class="pnote">A locked layer can’t be selected or moved, so you can work on top of it. Locking a layer fades it to 50%; unlocking brings back its opacity. Locked Items sets how faded anything locked looks.</div></div>`;

 d.innerHTML=`<div class="cbc" role="alertdialog" aria-modal="true"><h3>${taken?'Paused: you are working in another window':'The Notebook is already open in another window'}</h3><p>${taken?'Everything here was saved before the other window took over.':'Working in two windows at once can overwrite your changes, so this one is paused.'} Go back to the other window, or work here and the other one pauses.</p><button id="copyTake">Work Here Instead</button></div>`;
 d.querySelector('#copyTake').onclick=copyTake;}
function copyPause(taken){if(copyPaused)return;copyPaused=true;copyWait=false;try{closePop();}catch(e){}copyCard(taken);}
function copyTake(){const b=document.getElementById('copyTake');if(b){b.disabled=true;b.textContent='Switching…';}
 copyGo=()=>{copyGo=null;clearTimeout(copyT);try{sessionStorage.setItem('blk.take','1');}catch(e){}location.reload();};
 copyT=setTimeout(()=>{if(copyGo)copyGo();},1500);try{copyCh.postMessage({t:'take',id:COPY_ID});}catch(e){copyGo();}}
function copyInit(){if(!('BroadcastChannel' in window))return;try{copyCh=new BroadcastChannel('blk.copy');}catch(e){copyCh=null;return;}
 copyCh.onmessage=e=>{const m=e.data||{};if(!m.t||m.id===COPY_ID)return;
  if(m.t==='hello'){if(copyPaused)return;if(copyWait&&COPY_ID>m.id){if(!m.re)copyCh.postMessage({t:'hello',id:COPY_ID,re:1});return;} /* both just opened: the other one keeps working; say hello again in case it missed ours */
   copyCh.postMessage({t:'here',id:COPY_ID,to:m.id});}
  else if(m.t==='here'&&m.to===COPY_ID)copyPause(false);
  else if(m.t==='take'){if(!copyPaused){try{flushNotes();if(txTimer)txFlush();saveLocal();}catch(er){console.error(er);}copyPause(true);}setTimeout(()=>{try{copyCh.postMessage({t:'released',id:COPY_ID,to:m.id});}catch(er){}},350);}
  else if(m.t==='released'&&m.to===COPY_ID&&copyGo)copyGo();};
 let took=false;try{took=sessionStorage.getItem('blk.take')==='1';sessionStorage.removeItem('blk.take');}catch(e){}
 if(took)return;
 copyWait=true;copyCh.postMessage({t:'hello',id:COPY_ID});setTimeout(()=>{if(copyPaused||!copyWait)return;copyWait=false;if(copyDirty){copyDirty=false;saveLocal();}},400);}
addEventListener('keydown',e=>{if(copyPaused)e.stopImmediatePropagation();},true);
function bootFail(){if(document.getElementById('bootFail'))return;const d=document.createElement('div');d.id='bootFail';d.style.cssText='position:fixed;inset:0;z-index:999;background:#f6f5f1;display:flex;align-items:center;justify-content:center;padding:24px;font:16px/1.5 -apple-system,system-ui,sans-serif;color:#1c1c1e';
 d.innerHTML='<div style="max-width:460px"><h2 style="margin:0 0 10px;font-size:22px">Your scenes couldn’t be opened</h2><p style="margin:0 0 18px">They are saved on this device, but the app couldn’t read them just now. Close any other windows of the app and try again.</p><button id="bfRetry" style="font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:0;background:#2f6fde;color:#fff">Try again</button> <button id="bfNew" style="font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #c9c8c3;background:#fff;margin-left:8px">Start empty instead</button><p style="margin:16px 0 0;font-size:13px;color:#6b6c72">Starting empty leaves the saved scenes where they are. If you sync, signing in brings your synced scenes back.</p></div>';
 document.body.appendChild(d);d.querySelector('#bfRetry').onclick=()=>location.reload();d.querySelector('#bfNew').onclick=()=>{try{localStorage.removeItem(BIG);}catch(e){}d.remove();start();};}
/* which saved copy to open: the small store, or the large one. If the marker and the copies disagree, the newer pair wins; a slow or failed read never becomes an empty project without being asked */
function boot(){const small=lsGet(LS.p),big=!!lsGet(BIG);
 if(small&&!big){start();return;}
 const t=setTimeout(()=>{if(!started)bootFail();},6000),gOf=sj=>{try{return (JSON.parse(sj||'{}').g)||0;}catch(e){return 0;}};
 Promise.all([kvGet('p'),kvGet('s')]).then(([v,sj])=>{if(started)return;clearTimeout(t);const f=document.getElementById('bootFail');
  if(v&&small&&gOf(lsGet(LS.sync))>gOf(sj)){if(f)f.remove();start();return;}
  if(v){if(f)f.remove();start(v,sj||undefined);return;}
  if(small||!big){if(f)f.remove();start();return;}
  bootFail();}).catch(()=>{if(started)return;clearTimeout(t);if(small){start();return;}bootFail();});}
/* ---------- toolbars that fit ---------- */
let fitQ=0;
function fitBars(){fitQ=0;const T=$('#top'),B=$('#bar'),A=$('#animBar');
 if(T&&T.clientWidth){T.classList.remove('t1','t2','t3');const sb=$('#sceneBtn'),st=$('#sceneBtnT');
  const over=()=>T.scrollWidth>T.clientWidth+1,cut=min=>{if(!sb||!st||st.scrollWidth<=st.clientWidth+1)return false;const w=sb.getBoundingClientRect().width;sb.style.flex='none';const nat=sb.getBoundingClientRect().width;sb.style.flex='';return w<Math.min(nat,min)-1;};
  if(over()||cut(300)){T.classList.add('t1');if(over()||cut(330)){T.classList.add('t2');if(over())T.classList.add('t3');}}}
 if(B&&B.clientWidth){B.classList.remove('c1','c2','c3');
  const over=()=>B.scrollWidth>B.clientWidth+1||(A&&A.scrollWidth>A.clientWidth+1);
  if(over()){B.classList.add('c1');if(over()){B.classList.add('c2');if(over())B.classList.add('c3');}}}}
const fitSoon=()=>{if(!fitQ)fitQ=requestAnimationFrame(fitBars);};
try{const ro=new ResizeObserver(fitSoon);ro.observe($('#top'));ro.observe($('#bar'));
 const mo=new MutationObserver(fitSoon);mo.observe($('#top'),{childList:true,characterData:true,subtree:true});mo.observe($('#bar'),{childList:true,characterData:true,subtree:true});
 new MutationObserver(fitSoon).observe($('#app'),{attributes:true,attributeFilter:['class']});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitSoon);}catch(e){}
/*boot*/boot();
})();
</script>
