<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ShotMap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1e1f22">
<meta name="apple-mobile-web-app-title" content="ShotMap">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* VOICE: a working tool for set and scout days; the diagram is paper, the chrome stays out of the way
   IDEA: Shot Designer's overhead plan: dark tool strip below, shot list down the right
   PICTURE: the floor-plan canvas, edge to edge
   COLOR/TYPE: graphite toolbars and menus, paper-white canvas; setup and character colors are the only color; system sans
   LAYOUT: slim top bar, canvas, dark bottom toolbar; shot list column right (drawer under 1000px) */
:root{color-scheme:light dark;
 --bg:light-dark(#e9e7e2,#141518);--panel:light-dark(#ffffff,#1d1e22);--ink:light-dark(#1c1c1e,#ececec);
 --mut:light-dark(#6b6b70,#9b9ba3);--line:light-dark(#dad8d2,#313238);--chip:light-dark(#f1f0ec,#2a2b31);
 --accent:#2f6fde;--danger:#c93a36;--dark:#1e1f22;--dark2:#2c2d31;--paper:#ffffff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
 font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-rows:50px minmax(0,1fr);grid-template-columns:minmax(0,1fr) 300px;height:100vh;height:100dvh}
#app.side-off{grid-template-columns:minmax(0,1fr) 0}#app.side-off #side{display:none}
#top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;padding:0 4px;white-space:nowrap}
#top select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:0 8px;max-width:240px;font-size:16px}
#sceneBtn{height:36px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:0 10px;max-width:min(400px,42vw);min-width:0;font-size:15px}
#sceneBtn svg{flex:none}#sceneBtnT{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:600}#sceneBtnT small{font-size:13px;font-weight:500;color:var(--mut)}
.card.brcard{width:min(600px,100%);height:min(86vh,760px);padding:0;display:flex;flex-direction:column;overflow:hidden}
#br{display:flex;flex-direction:column;height:100%;min-height:0}
.brh{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:10px 10px 2px}
.brh h3{margin:0;text-align:center;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brb{width:40px;height:40px;border:0;border-radius:20px;background:none;font-size:24px;line-height:1;color:var(--mut)}.brb:hover{background:var(--chip)}
.brcr{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;justify-content:center;padding:0 16px 2px;font-size:13px;color:var(--mut)}
.brcr button{border:0;background:none;color:var(--accent);padding:3px 4px;font-size:13px}
.brsearch{margin:8px 14px 6px;position:relative}.brsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px}
.brsearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--chip);padding:0 12px 0 36px;font-size:16px;box-sizing:border-box}
#brTools{display:flex;gap:8px;padding:2px 14px 10px;flex-wrap:wrap}#brTools:empty{display:none}
#brTools button{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--panel);font-size:14px}
#brTools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#brTools .danger,.menu button.danger,#brFoot .danger{color:#c0392b}
#brL{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.brsec{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:14px 16px 6px}
.brr{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;min-height:58px;border-bottom:1px solid var(--line);cursor:pointer}
.brr:hover{background:var(--chip)}.brr.cur{background:rgba(58,123,213,.07)}.brr.picked{background:rgba(58,123,213,.14)}
.bri{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center}.bri svg{width:30px;height:30px}
.brt{flex:1;min-width:0}.brt b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brt b em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);margin-left:8px;text-transform:uppercase;letter-spacing:.04em}
.brt small{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brm{width:42px;height:42px;border:0;background:none;border-radius:21px;color:var(--mut);font-size:12px;letter-spacing:1px;flex:none}.brm:hover{background:rgba(0,0,0,.07)}
.chev{color:var(--mut);font-size:22px;width:16px;flex:none}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid #b8bcc4;box-sizing:border-box}.picked .ck{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px #fff}
.brempty{padding:44px 24px;text-align:center;color:var(--mut)}.brempty small{display:block;margin-top:8px;font-size:12.5px}
.brnote{font-size:13px;color:var(--mut);padding:10px 16px;border-bottom:1px solid var(--line)}
#brFoot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}#brFoot:empty{display:none}
#brFoot span{flex:1;font-weight:650}#brFoot button{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--chip)}#brFoot button:disabled{opacity:.45}
#brSub{display:none}#br.sub>*:not(#brSub){display:none}#br.sub #brSub{display:block;padding:20px;overflow:auto;flex:1}
.mvl{margin-top:10px;border-top:1px solid var(--line)}.mvl button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px;padding-right:12px}
.mvl button svg{width:22px;height:22px;flex:none}.mvl button:disabled{opacity:.4;cursor:default}.mvl small{color:var(--mut)}
details.oth{margin-top:12px}details.oth summary{font-size:12.5px;font-weight:650;color:var(--mut);cursor:pointer;margin-bottom:8px}
.kb{float:right;color:var(--mut);font-size:12px;margin-top:2px}
.card.imcard{width:min(660px,100%)}
.imgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.imgrid select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--chip);padding:0 8px;font-size:16px}
.imsc{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:9px;font-size:13px}.imsc div{padding:6px 10px;border-bottom:1px solid var(--line)}.imsc b{display:inline-block;min-width:34px;color:var(--mut)}.imsc small{display:block;color:var(--mut);padding-left:34px}
.imch{max-height:min(42vh,380px);overflow:auto;border:1px solid var(--line);border-radius:10px}
.imr{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}.imr.off .imn,.imr.off .imsx{opacity:.4}
.imck{width:24px;height:24px;border-radius:6px;border:1.5px solid #b8bcc4;background:var(--panel);font-size:14px;line-height:1;padding:0;flex:none;color:#fff}.imr:not(.off) .imck{background:var(--accent);border-color:var(--accent)}
.imn{flex:1;min-width:0}.imn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.imn small{color:var(--mut);font-size:12px}
.imsx{flex:none}.imsx button{min-height:32px;padding:0 10px;font-size:13px}.imq{width:38px;font-style:normal;font-size:11px;color:#b7791f;font-weight:700;flex:none}
.imopt{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.card.keycard{width:min(560px,100%)}.kt div{display:flex;gap:12px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.kt kbd{flex:none;min-width:92px;font:600 12.5px/1.6 ui-monospace,Menlo,monospace;color:var(--ink)}
.grip{cursor:grab;touch-action:none;color:#a3a5ab;font-size:16px;line-height:1;padding:6px 4px;flex:none;user-select:none;-webkit-user-select:none}
#shots .sr{grid-template-columns:54px minmax(0,1fr) 30px}.sr .grip{order:9;justify-self:center}.sl .grip{margin-left:6px;vertical-align:middle}
.dragging{opacity:.45}.dropline{position:fixed;height:3px;background:var(--accent);border-radius:2px;z-index:80;pointer-events:none}
#drop{position:fixed;z-index:70;background:#232427;color:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);min-width:240px;overflow:hidden}
#drop h4{margin:0;padding:12px 16px;text-align:center;font-size:16px;border-bottom:1px solid #3a3b40}
#drop button{display:block;width:100%;min-height:48px;padding:0 18px;border:0;border-bottom:1px solid #34353a;background:none;color:#fff;font-size:15.5px;text-align:left}#drop button:hover{background:#2e2f34}
.card.numcard{width:min(520px,100%)}.rgrp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rrow{display:flex;align-items:center;width:100%;min-height:46px;padding:6px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}.rrow:last-child{border-bottom:0}
.rrow span{flex:1}.rrow b{font-weight:600}.rrow small{display:block;color:var(--mut);font-size:12px}
.rrow .rad{width:20px;height:20px;border-radius:50%;border:2px solid #9a9ba1;flex:none;box-sizing:border-box}.rrow .rad.on{border:6px solid var(--accent)}
.bgrip{font-size:17px;padding:8px 6px}.brr.droptgt,.brcr button.droptgt,.brb.droptgt{background:rgba(47,111,222,.16);outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.brghost{position:fixed;z-index:90;pointer-events:none;background:#232427;color:#fff;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#animBar{display:flex;align-items:center;gap:2px;min-width:0}#animBar>button{min-width:40px}#animBar #aPlay.on{background:#2f6fde;color:#fff}
#animBar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.asteps{display:flex;gap:1px;overflow-x:auto;max-width:min(46vw,620px);scrollbar-width:none}.asteps::-webkit-scrollbar{display:none}
#bar .ast{min-width:34px;font-weight:700;color:#d6d7dc;padding:0 6px}#bar .ast.dim{color:#6c6d73}#bar .ast.cur{color:#fff;background:#2f6fde;border-radius:8px}
.stepgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px 14px;width:290px;box-sizing:border-box}.stepgrid button{height:40px;border-radius:8px;border:1px solid #3a3b40;background:#2c2d31;color:#fff;font-weight:700;font-size:15px}.stepgrid button.on{background:#2f7cf6;border-color:#2f7cf6}
#pop .pgonly{margin-left:8px;font-size:11px;font-weight:700;color:#8fb6ff;text-transform:uppercase}
.imxr .xl{width:110px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--chip);font-size:14px;text-transform:uppercase}.imxr .xn{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--chip);font-size:15px}.imxr{cursor:default}
#pop .lays .lrow{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px 0 18px;border-bottom:1px solid #34353a}
#pop .lays .lrow.dis{opacity:.45}#pop .lays .ln{width:118px;flex:none;font-size:15px}#pop .lays input[type=range]{flex:1;min-width:0;accent-color:#3d8bf7}
#pop .lays .lv{width:28px;text-align:right;font-size:13px;color:#c9cad0;font-variant-numeric:tabular-nums}
#pop .lays .lk{width:36px;height:36px;border-radius:8px;border:0;background:none;color:#7c7d84;display:flex;align-items:center;justify-content:center;flex:none;padding:0;min-height:0}
#pop .lays .lk.on{color:#fff;background:#2f7cf6}#pop .lays .lall{justify-content:space-between}
#pop .lays .lkall{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #45464c;background:#2c2d31;color:#fff;font-size:14px;width:auto;min-height:0}#pop .lays .lkall.on{background:#2f7cf6;border-color:#2f7cf6}
#pop .hdr{float:right;font-weight:400;opacity:.7}
.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;font-size:14px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.sp{flex:1}
#status{font-size:12.5px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer;min-height:36px}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut)}
#status.ok::before{background:#30a46c}#status.warn::before{background:#e3a008}#status.bad::before{background:var(--danger)}#status.bad{color:var(--danger)}
#main{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;background:var(--paper);color:#1c1c1e;color-scheme:light}
#wrap{position:relative;flex:1;min-height:0;background:#fbfbf9;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#chip{position:absolute;left:12px;top:10px;max-width:calc(100% - 24px);text-align:left;border:1px solid #e1e0db;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 12px;color:#1c1c1e;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#chip b{font-size:15px;text-transform:uppercase}#chip span{display:block;font-size:12px;color:#6b6b70;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#6f6f74;max-width:380px;pointer-events:none}
#empty b{display:block;font-size:19px;color:#2a2a2d;margin-bottom:6px}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--dark);color:#fff;padding:6px 6px 6px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6;max-width:calc(100% - 24px)}
#banner.on{display:flex}#banner button{height:36px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:650}
#ctx{position:absolute;display:none;gap:2px;background:var(--dark);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:5;white-space:nowrap}
#ctx.on{display:flex}
#ctx button{height:40px;padding:0 12px;border:0;border-radius:8px;background:none;color:#fff;font-size:14px}
#ctx button:hover,#ctx button:active{background:var(--dark2)}
#ctx .nm{display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;color:#fff;font-weight:700;font-size:14px;border-right:1px solid #3a3b40;margin-right:2px}
#ctx .nm i{width:12px;height:12px;border-radius:50%}
#ctx .dg{color:#ff8a85}
#insp{position:absolute;right:12px;top:12px;width:320px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);color-scheme:light dark;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.2);padding:14px 16px 16px;display:none;z-index:7;-webkit-overflow-scrolling:touch}
#insp.on{display:block}
#bar{display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--dark);color:#fff;overflow-x:auto;flex:none}
#bar button{height:44px;min-width:44px;padding:0 10px;border:0;border-radius:9px;background:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;white-space:nowrap}
#bar button:hover,#bar button.open{background:var(--dark2)}
#bar button.on{background:#3d4a63}
#bar button:disabled{opacity:.35}
#bar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar .pq{min-width:38px;font-weight:700;color:#bfc0c6}#bar .pq.cur{color:#fff;background:var(--dark2)}
#bar .sep{width:1px;height:26px;background:#3a3b40;margin:0 6px;flex:none}
#pop{position:absolute;bottom:62px;left:8px;z-index:9;background:#232427;color:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:none;max-height:calc(100% - 80px);overflow:auto;-webkit-overflow-scrolling:touch}
#pop.on{display:block}
#pop h4{margin:0;padding:12px 16px;text-align:center;font-size:17px;border-bottom:1px solid #3a3b40;position:sticky;top:0;background:#232427;z-index:1}
#pop .ls button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 18px;border:0;border-bottom:1px solid #34353a;background:none;color:#fff;font-size:16px;text-align:left}
#pop .ls button:hover{background:#2e2f34}
#pop .ls .plus{width:26px;height:26px;border-radius:50%;background:#2fa84f;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;flex:none}
#pop .ls .rad{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #9a9ba1;flex:none}
#pop .ls .rad.on{border:6px solid #3d8bf7;background:#fff}
#pop .xdel{width:26px;height:26px;border-radius:50%;background:#c4302b;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
#pop .chk{margin-left:auto;width:28px;height:28px;border-radius:4px;border:2px solid #9a9ba1;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}#pop .chk.on{background:#2f7cf6;border-color:#2f7cf6}
#pop .dupi{width:26px;height:26px;position:relative;flex:none}#pop .dupi::before,#pop .dupi::after{content:"";position:absolute;width:16px;height:16px;border-radius:2px}#pop .dupi::before{left:2px;top:2px;background:#6b7280}#pop .dupi::after{left:9px;top:9px;background:#dfe7f1}
#pop .lbli{width:28px;height:20px;border-radius:50%;background:#e8eda8;flex:none}
#pop .pgv{margin-left:auto;color:#d6d7db}
#pop h4 .back{position:absolute;left:8px;top:8px}#pop h4{position:relative}
#pop .hd{padding:6px 18px;background:#3a3b40;font-weight:700;font-size:14px}
#pop .back{position:absolute;left:8px;top:8px;height:32px;padding:0 10px;border:0;border-radius:7px;background:#34353a;color:#fff;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:1px;background:#4a4b50;width:min(760px,calc(100vw - 40px))}
.grid button{background:#fff;color:#1c1c1e;border:0;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:8px 4px 8px;font-size:13px;line-height:1.15}
.grid button:hover{background:#eef3fd}
.grid svg{width:64px;height:58px;flex:none}
.gh{grid-column:1/-1;background:#3a3b40;color:#fff;font-weight:700;font-size:13px;padding:7px 12px}
.stk{position:sticky;top:0;z-index:2;background:#232427}#pop .stk h4{position:static}.gs{padding:8px 10px;background:#232427}.gs input{width:100%;height:40px;border-radius:9px;border:0;padding:0 12px;font-size:16px;background:#fff;color:#1c1c1e}
.grid svg .pf{fill:#cfd8e3;stroke:#4b5563}
#side{grid-column:2;grid-row:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.slh{display:flex;align-items:center;gap:6px;background:var(--dark);color:#fff;height:48px;padding:0 6px;flex:none}
.slh b{flex:1;text-align:center;font-size:18px}
.slh button{width:40px;height:36px;border:0;border-radius:8px;background:none;color:#fff;font-size:18px}
.slh button:hover{background:var(--dark2)}
#shots{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sr{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line);min-height:52px;cursor:pointer;background:var(--chip)}

.sr .st{padding:6px 10px 6px 0;font-weight:700;font-size:14.5px;line-height:1.2;text-transform:uppercase}
.sr .st small{display:block;font-weight:500;color:var(--mut);text-transform:none;font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgap{height:6px;background:var(--line)}

.hint{color:var(--mut);font-size:13px;margin:12px}
.ph{font-weight:750;font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-right:34px}
.x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:17px;border:0;background:var(--chip);font-size:18px;line-height:34px;padding:0}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.mut{color:var(--mut);font-weight:400;font-size:12.5px}
.lbl{font-size:12.5px;font-weight:650;color:var(--mut);margin:12px 0 6px}
.fld{display:block;font-size:12.5px;font-weight:650;color:var(--mut);margin:10px 0 0}
.fld input,.fld select{display:block;width:100%;margin-top:4px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:0 10px;font-size:16px;color:var(--ink);font-weight:500}

.pgck{display:flex;flex-wrap:wrap;gap:6px}.pgck button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--chip);font-size:13.5px}.pgck button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin-top:12px}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.12);background:var(--c);padding:0}
.swb.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.swc{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:15px;background:var(--chip);font-size:12.5px;cursor:pointer}
.swc input{width:24px;height:24px;border:0;padding:0;background:none;border-radius:50%}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btns.end{justify-content:flex-end;margin-top:18px}
.btns button,.sm{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-size:14px}
.danger{color:var(--danger)}
.pri{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.pri.danger{background:var(--danger)!important;border-color:var(--danger)!important}
.sb{width:150px;aspect-ratio:16/9;border-radius:6px;border:1.5px dashed #c9c8c2;background:#f6f5f1;display:flex;align-items:center;justify-content:center;color:#6f6f74;font-size:13px;overflow:hidden;padding:0}
.sb img{width:100%;height:100%;object-fit:cover;display:block}.sb.has{border:0}
.sbw{position:relative;width:150px}
.sbx{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:14px;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:16px;line-height:28px;padding:0}

.sl select{width:100%;height:36px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:15px;color:#1c1c1e}
.sl input,.sl textarea{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px;font-size:16px;color:#1c1c1e;font-family:inherit}
.sl input:focus,.sl textarea:focus,.sl select:focus{border-color:#d6d5d0;background:#f6f5f1;outline:none}
.sl textarea{resize:vertical;min-height:88px;line-height:1.35}

.shotno i{width:14px;height:14px;border-radius:3px}
.ver{font-weight:700;padding:6px 4px;font-size:16px}
.lv-empty{padding:48px 24px;text-align:center;color:#6f6f74}
#modal{position:fixed;inset:0;background:rgba(10,10,12,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.card{background:var(--panel);color:var(--ink);border-radius:14px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card h3{margin:0 0 6px;font-size:19px}.card p{margin:6px 0}
.nums{display:flex;gap:8px;margin-top:10px}
.num{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:20px;font-weight:700}
.num.on{background:var(--ink);color:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:18px;border:1px solid var(--line);background:var(--chip);font-weight:600;text-transform:uppercase;font-size:13px}

.menu{display:flex;flex-direction:column;gap:6px;margin-top:10px}

.menu small{display:block;color:var(--mut);font-size:12px;line-height:1.3}

#toast.show{opacity:1}

}

function blankScene(num){const pg={id:uid(),name:'Page 1'};return {id:uid(),number:String(num),title:'',heading:'',synopsis:'',code:'',day:'',setups:[],items:[],pages:[pg],bgId:null,bg:null,pageId:pg.id};}
let P=null,images={},sel=null;
const scene=()=>P.scenes.find(s=>s.id===P.sceneId)||P.scenes[0];
const vis=(it,s,pid)=>{pid=pid||s.pageId;return pid==='all'||!it.pgs||it.pgs.includes(pid);};
const curPgs=()=>{const s=scene();return s.pageId==='all'?null:[s.pageId];};
function pagesSummary(it){const s=scene();if(!it.pgs)return 'All';return it.pgs.map(id=>s.pages.findIndex(p=>p.id===id)+1).filter(n=>n>0).sort((a,b)=>a-b).join(', ');}
const pageItems=(s,pid)=>s.items.filter(it=>vis(it,s,pid));
const charById=id=>P.characters.find(c=>c.id===id);
const setupIn=(s,id)=>s.setups.find(x=>x.id===id);
const itemById=id=>scene().items.find(i=>i.id===id);
const pageName=(s,id)=>{const p=s.pages.find(x=>x.id===id);return p?p.name:'All pages';};
const ACTOR=t=>t==='char'||t==='cam';
const BOX=t=>t==='prop'||t==='set'||t==='light'||t==='mask';
function migrateScene(s){
 if(!s.items){s.items=[];s.pages.forEach((pg,pi)=>{for(const it of (pg.items||[])){
   if(it.type==='rect'){it.type='prop';it.kind='sqtable';delete it.fill;}
   if(it.type==='round'){it.type='prop';it.kind='roundtable';it.w=it.h=it.r*2;it.rot=0;delete it.r;delete it.fill;}
   if(it.type==='mask')it.kind='mask';
   it.pg=(!ACTOR(it.type)&&pi===0)?null:pg.id;s.items.push(it);}
  if(pg.bgId&&!s.bgId){s.bgId=pg.bgId;s.bg=pg.bg;}delete pg.items;delete pg.bgId;delete pg.bg;});}
 for(const it of s.items)if('pg' in it){it.pgs=it.pg?[it.pg]:null;delete it.pg;}
 if(!s.pageId||(s.pageId!=='all'&&!s.pages.some(p=>p.id===s.pageId)))s.pageId=s.pages[0].id;
 for(const it of s.items){const ps=it.marks||it.mv?positions(it):[];for(let i=1;i<ps.length;i++){const b=ps[i];if(b.c){const a=ps[i-1];b.cp=[toTD(a,b,{x:(a.x+b.x)/2+b.c.x/2,y:(a.y+b.y)/2+b.c.y/2})];delete b.c;}}}
 if(!s.numbering&&s.setups.length){s.setups.sort((a,b)=>natCmp(a.num,b.num));const used=new Set(s.items.filter(i=>i.type==='cam').map(i=>i.setupId)),live=s.setups.filter(st=>used.has(st.id));s.numbering={auto:live.every((st,i)=>+st.num===i+1)};}
 for(const it of s.items)if(it.type==='char'&&it.marks.some(m=>m.turn!=null)){const out=[];it.marks.forEach(m=>{out.push(m);if(m.turn!=null){const t=m.turn;delete m.turn;shiftAxis(s,it.id,out.length,1);out.push({x:m.x,y:m.y,rot:t,t:1});}});it.marks=out;}
 for(const it of s.items)if(it.kind==='dollytrack'){it.h=TRACK_H;it.w=Math.max(4,Math.round(it.w/FT/4)*4)*FT;}
 for(const it of s.items)if(it.type==='cam')for(const m of it.marks)if(m.sbp){m.sba={x:m.x+m.sbp.x,y:m.y+m.sbp.y};delete m.sbp;}
 for(const it of s.items)if(it.type==='cam'&&it.desc!=null){if(!it.marks[0].type)it.marks[0].type=it.desc;delete it.desc;}
}
function migrate(){for(const s of P.scenes)migrateScene(s);}

/* ---------- local storage + sync bookkeeping ---------- */
const LS={p:'blk.p',img:'blk.img',sync:'blk.sync'};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
const DEVICE=(()=>{let d=lsGet('blk.dev');if(!d){d=uid();lsSet('blk.dev',d);}return d;})();
let sync={stamps:{},dirty:[]},lastJson={},localOk=true,imgDirty=false;
function load(){
 try{const s=lsGet(LS.p);if(s)P=JSON.parse(s);}catch(e){P=null;}
 try{const s=lsGet(LS.img);if(s)images=JSON.parse(s)||{};}catch(e){images={};}
 try{const s=lsGet(LS.sync);if(s)sync=Object.assign({stamps:{},dirty:[]},JSON.parse(s));}catch(e){}
 if(!P||!Array.isArray(P.scenes)||!P.scenes.length){const s=blankScene(1);P={characters:[],folders:[],scenes:[s],sceneId:s.id,ui:{}};sync={stamps:{},dirty:[]};}
 P.ui=P.ui||{};P.characters=P.characters||[];P.folders=P.folders||[];
 if(!P.scenes.some(s=>s.id===P.sceneId))P.sceneId=P.scenes[0].id;
 migrate();ensureLive();baseline();
}
const stripScene=s=>{const o=Object.assign({},s);delete o.pageId;return o;};
function docs(){const d={meta:{characters:P.characters,folders:P.folders,sceneOrder:P.scenes.map(s=>s.id)}};for(const s of P.scenes)d['scene-'+s.id]={scene:stripScene(s)};return d;}
function baseline(){lastJson={};const d=docs();for(const k in d)lastJson[k]=JSON.stringify(d[k]);}
const markDirty=k=>{if(!sync.dirty.includes(k))sync.dirty.push(k);};
function detectChanges(){const d=docs(),now=Date.now();
 for(const k in d){const j=JSON.stringify(d[k]);if(j!==lastJson[k]){lastJson[k]=j;sync.stamps[k]=now;markDirty(k);}}
 for(const k of Object.keys(lastJson))if(!(k in d)){delete lastJson[k];sync.stamps[k]=now;markDirty(k);}}
function saveLocal(){
 const ok=lsSet(LS.p,JSON.stringify(P))&&lsSet(LS.sync,JSON.stringify(sync));
 let ok2=true;if(imgDirty){if(idb){const batch={};for(const k in images)if(!imgSaved.has(k)){batch[k]=images[k];imgSaved.add(k);}imgDirty=false;idbPut(batch).then(r=>{if(!r){localOk=false;updateStatus();}});}else{ok2=lsSet(LS.img,JSON.stringify(images));if(ok2)imgDirty=false;}}
 localOk=ok&&ok2;updateStatus();
}
let idb=null;const imgSaved=new Set();
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('blocking-board',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('img'))d.createObjectStore('img');if(!d.objectStoreNames.contains('snap'))d.createObjectStore('snap');};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);}catch(e){res(null);}});}
function idbAll(){return new Promise(res=>{try{const out={},rq=idb.transaction('img').objectStore('img').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};rq.onerror=()=>res(out);}catch(e){res({});}});}
function idbPut(obj){return new Promise(res=>{try{if(!Object.keys(obj).length){res(true);return;}const tx=idb.transaction('img','readwrite'),st=tx.objectStore('img');for(const k in obj)st.put(obj[k],k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(e){res(false);}});}
/* ---------- version snapshots every 5 minutes ---------- */
let lastSnap=null;
function snapPut(t,v){return new Promise(res=>{try{const tx=idb.transaction('snap','readwrite');tx.objectStore('snap').put(v,t);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
function snapList(){return new Promise(res=>{try{const out=[],rq=idb.transaction('snap').objectStore('snap').openCursor(null,'prev');rq.onsuccess=()=>{const c=rq.result;if(c){out.push({t:c.key,v:c.value});c.continue();}else res(out);};rq.onerror=()=>res(out);}catch(e){res([]);}});}
function snapDel(keys){return new Promise(res=>{try{const tx=idb.transaction('snap','readwrite'),st=tx.objectStore('snap');keys.forEach(k=>st.delete(k));tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
async function takeSnap(){
 if(!idb)return;const cur0=snapshot();if(cur0===lastSnap)return;
 const n=liveScenes().length,shots=liveScenes().reduce((a,s)=>a+s.items.filter(i=>i.type==='cam').reduce((b,i)=>b+i.marks.length,0),0);
 if(await snapPut(Date.now(),{data:cur0,scenes:n,shots})){lastSnap=cur0;const all=await snapList();if(all.length>72)await snapDel(all.slice(72).map(x=>x.t));}
}
async function versionsDialog(){
 if(!idb){toast('Earlier versions aren’t available in this browser.');return;}
 await takeSnap();const all=await snapList();
 const fmt=t=>{const d=new Date(t),today=new Date().toDateString()===d.toDateString();return (today?'Today':d.toLocaleDateString(undefined,{month:'short',day:'numeric'}))+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};
 modal(`<h3>Earlier versions</h3><p class="mut">A copy of everything is kept every five minutes while you work, for the last six hours or so of editing. Restoring one replaces what’s here now; you can undo it.</p><div class="menu">${all.length?all.map((x,i)=>`<button data-t="${x.t}"><b>${fmt(x.t)}${i===0?' · latest':''}</b><small>${x.v.scenes} scene${x.v.scenes===1?'':'s'}, ${x.v.shots} shot${x.v.shots===1?'':'s'}</small></button>`).join(''):'<p class="mut">No earlier versions yet.</p>'}</div><div class="btns end"><button data-x>Close</button></div>`,card=>{

   confirmBox('Restore this version?',`Everything goes back to how it was at ${fmt(x.t)}. You can undo this.`,'Restore',()=>{const o=JSON.parse(x.v.data);P.characters=o.c;if(o.f)P.folders=o.f;P.scenes=o.s.map(sc=>{migrateScene(sc);return sc;});if(!P.scenes.some(sc=>sc.id===P.sceneId))P.sceneId=P.scenes[0].id;ensureLive();sel=null;inspOpen=false;commit();fit();toast('Version restored.');});});
 });
}

async function exportPDF(which){

 try{const {jsPDF}=await loadJsPDF(),doc=new jsPDF({orientation:'landscape',unit:'pt',format:'letter'});
  const svgs=[];if(which!=='list')for(const pg of s.pages)svgs.push(sheetSVG(s,pg.id));if(which!=='diagram')svgs.push(...listPagesSVG(s));
  if(!svgs.length){toast('No shots to put in the shot list yet.');return;}
  for(let i=0;i<svgs.length;i++){const c=await rasterize(svgs[i],1650,1275,1.4);if(i)doc.addPage('letter','landscape');doc.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,792,612);}
  await save(fname(s)+(which==='list'?' shot list':'')+'.pdf',doc.output('blob'));
 }catch(e){toast('PDF export failed. Try the image instead.');}
}

/* ---------- shot numbering + reordering ---------- */
const NUM_DEF={cam:'1A',ver:'1',auto:true,start:1};
function numCfg(s){return Object.assign({},NUM_DEF,P.numDefault||{},(s&&s.numbering)||{});}
function byLetter(a,b){return natCmp(a.letter,b.letter);}
function setupCams(s,id){return s.items.filter(c=>c.type==='cam'&&c.setupId===id).sort(byLetter);}
function camSeq(s,it){let i=0;for(const st of s.setups)for(const c of setupCams(s,st.id)){if(c===it)return i;i++;}return 0;}
function letterSeq(n){let r='';n++;while(n>0){const k=(n-1)%26;r=String.fromCharCode(65+k)+r;n=Math.floor((n-1)/26);}return r;}
function roman(n){const t=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const [v,l] of t)while(n>=v){r+=l;n-=v;}return r;}
function shotCode(s,it){const st=setupIn(s,it.setupId),c=numCfg(s),num=st?st.num:'?',L=it.letter||'';
 switch(c.cam){case '1-A':return num+'-'+L;case 'A-1':return L+'-'+num;case '1':return String((+c.start||1)+camSeq(s,it));case '0001':return String((+c.start||1)+camSeq(s,it)).padStart(4,'0');case 'A':return letterSeq((+c.start||1)-1+camSeq(s,it));default:return num+L;}}
function verCode(s,vi){const c=numCfg(s);return c.ver==='A'?letterSeq(vi):c.ver==='I'?roman(vi+1):String(vi+1);}
function normShots(s){const used=new Set(s.items.filter(i=>i.type==='cam').map(i=>i.setupId));s.setups=s.setups.filter(st=>used.has(st.id));const c=numCfg(s);if(c.auto)s.setups.forEach((st,i)=>{st.num=(+c.start||1)+i;});}
function moveSetup(s,id,to){const i=s.setups.findIndex(x=>x.id===id);if(i<0)return false;if(to===i||to===i+1)return false;const [st]=s.setups.splice(i,1);s.setups.splice(to>i?to-1:to,0,st);return true;}
function moveCamIn(s,it,to){const list=setupCams(s,it.setupId),i=list.indexOf(it);if(i<0||to===i||to===i+1)return false;const letters=list.map(c=>c.letter);list.splice(i,1);list.splice(to>i?to-1:to,0,it);list.forEach((c,k)=>c.letter=letters[k]);return true;}
function afterShotMove(s,it){commit();toast(`Shot moved. It’s now ${shotCode(s,it)}.`+(numCfg(s).auto?'':' (Automatic numbering is off, so numbers stayed put.)'));}
function bindShotDrag(box,rowSel){
 box.addEventListener('pointerdown',e=>{const gp=e.target.closest('.grip');if(!gp||!box.contains(gp))return;e.preventDefault();e.stopPropagation();
  const row=gp.closest(rowSel),s=scene(),it=row&&itemById(row.dataset.id);if(!it)return;
  const groups=[];for(const r of box.querySelectorAll(rowSel)){const c=itemById(r.dataset.id);if(!c)continue;const b=r.getBoundingClientRect();let g=groups[groups.length-1];if(!g||g.su!==c.setupId){g={su:c.setupId,top:b.top,bot:b.bottom,cams:[]};groups.push(g);}g.bot=b.bottom;let cm=g.cams[g.cams.length-1];if(!cm||cm.it!==c){cm={it:c,top:b.top,bot:b.bottom};g.cams.push(cm);}cm.bot=b.bottom;}
  const mine=groups.find(g=>g.su===it.setupId),line=document.createElement('div'),cb=box.getBoundingClientRect();line.className='dropline';document.body.appendChild(line);
  row.classList.add('dragging');try{gp.setPointerCapture(e.pointerId);}catch(_){}let res=null;
  const at=y=>{line.style.cssText=`left:${cb.left+4}px;width:${cb.width-8}px;top:${y-1.5}px`;};
  const mv=ev=>{const y=ev.clientY;
   if(mine.cams.length>1&&y>=mine.top+4&&y<=mine.bot-4){let k=mine.cams.findIndex(c=>y<(c.top+c.bot)/2);if(k<0)k=mine.cams.length;res={t:'cam',k};at(k<mine.cams.length?mine.cams[k].top:mine.cams[k-1].bot);}
   else{let k=groups.findIndex(g=>y<(g.top+g.bot)/2);if(k<0)k=groups.length;res={t:'su',k};at(k<groups.length?groups[k].top:groups[k-1].bot);}};
  const up=()=>{gp.removeEventListener('pointermove',mv);gp.removeEventListener('pointerup',up);gp.removeEventListener('pointercancel',up);line.remove();row.classList.remove('dragging');if(!res)return;
   let ok=false;if(res.t==='cam')ok=moveCamIn(s,it,res.k);else{const tgt=groups[res.k];ok=moveSetup(s,it.setupId,tgt?s.setups.findIndex(x=>x.id===tgt.su):s.setups.length);}
   if(ok)afterShotMove(s,it);};
  gp.addEventListener('pointermove',mv);gp.addEventListener('pointerup',up);gp.addEventListener('pointercancel',up);
 },true);
 box.addEventListener('click',e=>{if(e.target.closest('.grip'))e.stopPropagation();},true);
}

/* ---------- animation: step through the blocking ---------- */
let anim={step:0,frac:1,playing:false,raf:0,hold:0,base:null,speed:1,loop:false};
let IMF=null;
function effSteps(it){let p=0;return (it.marks||[]).map(m=>{const e=m.st!=null?+m.st:p+1;p=e;return e;});}
function lastIdx(st,N){let j=-1;st.forEach((e,i)=>{if(e<=N)j=i;});return j;}
function animActors(sc){return pageItems(sc).filter(it=>(it.type==='char'||it.type==='cam')&&it.marks&&it.marks.length);}
function maxStep(sc){let m=1;for(const it of animActors(sc))for(const e of effSteps(it))m=Math.max(m,e);return m;}
function legSample(a,b,soft){const P=[a,...legPts(a,b),b];if(P.length<3||!soft)return P.map(p=>({x:p.x,y:p.y}));const out=[{x:a.x,y:a.y}];
 for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2,c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};
  for(let k=1;k<=14;k++){const t=k/14,u=1-t;out.push({x:u*u*u*p1.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p2.x,y:u*u*u*p1.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p2.y});}}return out;}
const angLerp=(a,b,t)=>{const d=((b-a)%360+540)%360-180;return a+d*t;};
function timeline(it,N){
 const st=effSteps(it),cur=lastIdx(st,N),prev=lastIdx(st,N-1),isCam=it.type==='cam';
 if(cur<0)return null;
 if(isCam&&!st.some(e=>e===N))return {cam:true,idle:true};
 let s0=prev>=0?prev:(isCam?st.findIndex(e=>e===N):0);if(s0<0)s0=0;
 const sp=170*anim.speed,segs=[],legs=[];let face=it.type==='char'?effFacing(it,s0):(it.marks[s0].rot||0);
 if(prev<0)segs.push({k:'in',d:.35/anim.speed});
 for(let i=s0+1;i<=cur;i++){const a=it.marks[i-1],b=it.marks[i];
  if(it.type==='char'&&b.t){segs.push({k:'turn',r0:face,r1:b.rot,d:.55/anim.speed});if(b.back)segs.push({k:'turn',r0:b.rot,r1:face,d:.5/anim.speed});else face=b.rot;continue;}
  const pts=legSample(a,b,!it.hard);let len=0;for(let k=1;k<pts.length;k++)len+=Math.hypot(pts[k].x-pts[k-1].x,pts[k].y-pts[k-1].y);
  if(len>1){segs.push({k:'walk',pts,len,d:Math.max(.25,len/sp),r0:a.rot||0,r1:b.rot||0});legs.push(i);}
  if(it.type==='char'){const tr=b.rot||0;face=tr;}else face=b.rot||0;}
 if(isCam&&st[cur]===N)for(const q of (it.marks[cur].pans||[])){segs.push({k:'turn',r0:face,r1:q.rot,d:.6/anim.speed});face=q.rot;}
 return {s0,cur,segs,legs,dur:segs.reduce((a,s)=>a+s.d,0),cam:isCam,start:{x:it.marks[s0].x,y:it.marks[s0].y,rot:it.type==='char'?effFacing(it,s0):(it.marks[s0].rot||0)}};
}
function poseAt(it,tl,t){let x=tl.start.x,y=tl.start.y,r=tl.start.rot,op=1;
 for(const s of tl.segs){const f=s.d?clamp(t/s.d,0,1):1;
  if(s.k==='in'){op=f;}
  else if(s.k==='turn'){r=angLerp(s.r0,s.r1,f);}
  else{const tgt=f*s.len;let acc=0,k=1;for(;k<s.pts.length;k++){const L=Math.hypot(s.pts[k].x-s.pts[k-1].x,s.pts[k].y-s.pts[k-1].y);if(acc+L>=tgt){const u=L?(tgt-acc)/L:0;x=s.pts[k-1].x+(s.pts[k].x-s.pts[k-1].x)*u;y=s.pts[k-1].y+(s.pts[k].y-s.pts[k-1].y)*u;if(it.type==='char'&&f<1)r=Math.atan2(s.pts[k].y-s.pts[k-1].y,s.pts[k].x-s.pts[k-1].x)*180/Math.PI;break;}acc+=L;}
   if(k>=s.pts.length){const e=s.pts[s.pts.length-1];x=e.x;y=e.y;}
   if(it.type==='cam')r=angLerp(s.r0,s.r1,f);else if(f>=1)r=s.r1;}
  t-=s.d;if(t<0)break;}
 return {x,y,r,op};}
function stepDur(sc,N){let d=.4;for(const it of animActors(sc)){const tl=timeline(it,N);if(tl&&!tl.idle)d=Math.max(d,tl.dur);}return d;}
function animLayer(sc,N,frac){
 const T=frac*stepDur(sc,N);let paths='',bodies='',cams='';
 for(const it of animActors(sc)){const tl=timeline(it,N);if(!tl||tl.idle)continue;const p=poseAt(it,tl,T);
  if(it.type==='char'){const c=charById(it.charId);if(!c)continue;const col=c.color,dk=shade(col,-.5),L=behind(p.r,23),anc=L.c>.35?'start':L.c<-.35?'end':'middle',ly=L.y+(L.s>.35?8:L.s<-.35?-1:4);
   for(const i of tl.legs)paths+=arrow(it.marks[i-1],it.marks[i],col,true,19,!it.hard,'class="deco"');
   bodies+=`<g data-id="${it.id}" data-mark="${tl.cur}" transform="translate(${p.x},${p.y})${c.extra?' scale(.78)':''}" opacity="${p.op}"><circle r="26" fill="transparent"/><g transform="rotate(${p.r})"><circle r="15" fill="${col}" stroke="${dk}" stroke-width="2"/>${stripes(it.g||c.g,dk)}<path d="M12.5,-6.5L22,0L12.5,6.5Z" fill="${dk}"/></g><text class="nm deco" x="${L.x}" y="${ly}" text-anchor="${anc}">${esc(String(c.name||'?').toUpperCase()+(it.xn?' '+it.xn:''))}</text></g>`;}
  else{const st=setupIn(sc,it.setupId),col=st?st.color:'#999',dk=shade(col,-.42),tag=`Shot ${shotCode(sc,it)}`,pw=tag.length*6.3+12;
   for(const i of tl.legs)paths+=arrow(it.marks[i-1],it.marks[i],col,false,20,!it.hard,'class="deco"');
   cams+=`<g data-id="${it.id}" data-mark="${tl.cur}" transform="translate(${p.x},${p.y})" opacity="${p.op}"><circle r="26" fill="transparent"/><g transform="rotate(${p.r})"><rect x="-16" y="-10" width="21" height="20" rx="4" fill="${col}" stroke="${dk}" stroke-width="1.6"/><path d="M5,-5L15.5,-10.5V10.5L5,5Z" fill="${col}" stroke="${dk}" stroke-width="1.6" stroke-linejoin="round"/></g><g class="deco" transform="translate(0,${-34})"><rect x="${-pw/2}" y="-9" width="${pw}" height="16" rx="2" fill="#2f5f8f"/><text class="pl2" y="2.8" text-anchor="middle">${tag}</text></g></g>`;}}
 return `<g>${paths}${cams}${bodies}</g>`;}
function animBase(sc){IMF='noActors';const a=itemsMarkup(sc);IMF='onlyActors';const g=itemsMarkup(sc);IMF=null;return a+`<g class="deco" opacity=".16">${g}</g>`;}

const LAYERS=[['char','Characters'],['arrow','Arrows'],['cam','Cameras'],['sb','Storyboards'],['prop','Props'],['set','Set'],['light','Lighting'],['label','Labels']];

 const row=(key,name,val,lockOn,lockKey,dis)=>`<div class="lrow${dis?' dis':''}"><span class="ln">${name}</span><input type="range" min="1" max="100" step="1" value="${val}" data-op="${key}"${dis?' disabled':''}><b class="lv">${val}</b>${lockKey?`<button class="lk${lockOn?' on':''}" data-lock="${lockKey}" title="${lockOn?'Unlock':'Lock'} ${name}"${dis?' disabled':''}>${LOCK_SVG(lockOn)}</button>`:'<span class="lk"></span>'}</div>`;
 pop.innerHTML=`<h4>Layers</h4><div class="ls lays" style="width:350px"><div class="lrow lall"><span class="ln"><b>All layers</b></span><button class="lkall${all?' on':''}" data-lockall="1">${LOCK_SVG(all)}<span>${all?'Unlock all':'Lock all'}</span></button></div>

  <div class="hd" style="font-weight:400;font-size:12.5px;line-height:1.35;padding:10px 18px">A locked layer can’t be selected or moved, so you can work on top of it. Locked Items sets how faded anything locked looks.</div></div>`;

 if(g.type==='lasso'){if(g.pts.length>2)finishLasso(g.pts,e.clientX,e.clientY);else{setLasso(lassoArmed);renderUI();}flushRemote();return;}
 if(g.type==='mdrag'){if(g.moved)commit({insp:false});else multiPop(e.clientX,e.clientY);renderUI();flushRemote();return;}
